<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="词书架">
<meta name="theme-color" id="themeMeta" content="#F2F2F7">
<title>词书架 · 平板 / 笔记本端</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>
/* ===== Design Tokens (iOS / Liquid Glass) ===== */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#FFFFFF;
  --ink:#1C1C1E; --ink2:#6C6C70; --ink3:#AEAEB2;
  --line:rgba(60,60,67,.12); --line2:rgba(60,60,67,.22);
  --blue:#007AFF; --blue-tint:rgba(0,122,255,.12);
  --green:#34C759; --green-tint:rgba(52,199,89,.14);
  --indigo:#5856D6; --indigo-tint:rgba(88,86,214,.13);
  --orange:#FF9500; --orange-tint:rgba(255,149,0,.14);
  --red:#FF3B30; --red-tint:rgba(255,59,48,.12);
  --gray5:#E9E9EB; --gray6:#F2F2F7;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.08);
  --glass:linear-gradient(180deg,rgba(252,252,254,.66),rgba(244,244,249,.5));
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --accent:#007AFF;
  --cword:clamp(38px,9vw,88px); --cword-s:clamp(32px,8vw,70px); --cpro:clamp(24px,5vw,46px); --cpro-p:clamp(14px,2.6vw,22px);
  --cdef:clamp(16px,2.6vw,24px); --ccn:clamp(14px,2.2vw,20px); --cex:clamp(17px,2.6vw,24px); --cex-cn:clamp(14px,2.2vw,19px);
  --snd-letter:clamp(28px,6vw,48px); --snd-phone:clamp(15px,2.9vw,24px); --slot:clamp(22px,4vw,34px); --sent:clamp(18px,3.2vw,28px);
}
[data-theme="dark"]{
  --bg:#0C0C0E; --surface:#1C1C1E; --surface2:#2C2C2E;
  --ink:#F2F2F7; --ink2:#AEAEB2; --ink3:#636366;
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.24);
  --blue-tint:rgba(10,132,255,.18); --green-tint:rgba(48,209,88,.16);
  --indigo-tint:rgba(94,92,230,.18); --orange-tint:rgba(255,159,10,.18);
  --red-tint:rgba(255,69,58,.18);
  --gray5:#2C2C2E; --gray6:#1C1C1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.5);
  --glass:linear-gradient(180deg,rgba(44,44,46,.72),rgba(28,28,30,.55));
}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);background-clip:content-box;border:2px solid transparent}
[data-theme="dark"] .top-tabs .tab:hover{background:rgba(255,255,255,.08)}
[data-theme="dark"] .wl-item:hover{background:rgba(255,255,255,.08)}
[data-theme="dark"] .topbar{box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}
[data-theme="dark"] .topbar::before{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0))}
[data-theme="dark"] .study-top{box-shadow:inset 0 -1px 0 rgba(255,255,255,.08)}
[data-theme="dark"] .study-top::before{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0))}
[data-theme="dark"] .view b.on{background:#2C2C2E}
[data-theme="dark"] .seg b.on{background:#2C2C2E;box-shadow:0 1px 4px rgba(0,0,0,.4)}
[data-theme="dark"] .flow-card .fc-step.cur{background:#2C2C2E;box-shadow:0 0 0 1.5px var(--blue)}
[data-theme="dark"] .flow-card .fc-bar{background:rgba(255,255,255,.12)}
[data-theme="dark"] .chart .c-t .seg b.on{background:#2C2C2E}
[data-theme="dark"] .card{background:#1C1C1E}
[data-theme="dark"] .c-ex{background:#2C2C2E}
html[data-font="sm"]{--cword:calc(clamp(38px,9vw,88px)*.85); --cword-s:calc(clamp(32px,8vw,70px)*.85); --cpro:calc(clamp(24px,5vw,46px)*.85); --cpro-p:calc(clamp(14px,2.6vw,22px)*.85); --cdef:calc(clamp(16px,2.6vw,24px)*.88); --ccn:calc(clamp(14px,2.2vw,20px)*.9); --cex:calc(clamp(17px,2.6vw,24px)*.88); --cex-cn:calc(clamp(14px,2.2vw,19px)*.9); --snd-letter:calc(clamp(28px,6vw,48px)*.85); --snd-phone:calc(clamp(15px,2.9vw,24px)*.88); --slot:calc(clamp(22px,4vw,34px)*.88); --sent:calc(clamp(18px,3.2vw,28px)*.9)}
html[data-font="lg"]{--cword:calc(clamp(38px,9vw,88px)*1.18); --cword-s:calc(clamp(32px,8vw,70px)*1.18); --cpro:calc(clamp(24px,5vw,46px)*1.15); --cpro-p:calc(clamp(14px,2.6vw,22px)*1.15); --cdef:calc(clamp(16px,2.6vw,24px)*1.12); --ccn:calc(clamp(14px,2.2vw,20px)*1.12); --cex:calc(clamp(17px,2.6vw,24px)*1.12); --cex-cn:calc(clamp(14px,2.2vw,19px)*1.12); --snd-letter:calc(clamp(28px,6vw,48px)*1.15); --snd-phone:calc(clamp(15px,2.9vw,24px)*1.12); --slot:calc(clamp(22px,4vw,34px)*1.12); --sent:calc(clamp(18px,3.2vw,28px)*1.1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:var(--sans)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== App shell ===== */
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
.topbar{
  display:flex;align-items:center;gap:14px;padding:12px 22px;
  background:var(--glass);backdrop-filter:blur(34px) saturate(1.8);
  -webkit-backdrop-filter:blur(34px) saturate(1.8);
  border-bottom:0.5px solid rgba(60,60,67,.14);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.5);
  flex-shrink:0;position:relative;z-index:20;
}
.topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(255,255,255,0));pointer-events:none}
.topbar .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;position:relative}
.topbar .logo .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
.top-tabs{display:flex;align-items:center;gap:4px;margin-left:6px;position:relative}
.top-tabs .tab{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;border:none;background:none;transition:background .14s,color .14s}
.top-tabs .tab:hover{background:rgba(0,0,0,.04)}
.top-tabs .tab.on{color:var(--accent);background:var(--accent-tint,rgba(0,122,255,.12))}
.topbar .spacer{flex:1;position:relative}

/* ===== Main area ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden}
.page-title{padding:22px 30px 8px;font-size:28px;font-weight:800;letter-spacing:-.3px;flex-shrink:0;display:flex;align-items:center;gap:12px}
.page-title .sp{flex:1}
.page-title .btn{padding:7px 15px;font-size:13px;flex-shrink:0}
.page-content{padding:8px 30px 24px;overflow:auto;flex:1}
.page-title .pt-sub{font-size:14px;font-weight:600;color:var(--ink2);margin-left:8px;letter-spacing:0}

/* ===== Shared primitives ===== */
.btn{font-family:var(--sans);font-size:14px;font-weight:600;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--accent);color:#fff;transition:filter .14s,transform .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.tint{background:var(--accent-tint,rgba(0,122,255,.12));color:var(--accent)}
.btn.gray{background:var(--gray5);color:var(--ink2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.big{font-size:15px;padding:13px 26px;border-radius:12px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;display:inline-block}
.tag.new{background:var(--green-tint);color:var(--green)}
.tag.rev{background:var(--orange-tint);color:var(--orange)}
.tag.done{background:var(--green-tint);color:var(--green)}
.tag.cur{background:var(--blue-tint);color:var(--blue)}
.tag.ing{background:var(--indigo-tint);color:var(--indigo)}
.prog{height:6px;border-radius:3px;background:var(--gray5);overflow:hidden}
.prog i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.prog.g i{background:var(--green)}
.prog.ind i{background:var(--indigo)}
.prog.or i{background:var(--orange)}
.prog.red i{background:var(--red)}

/* ===== Panel / cards ===== */
.panel{background:var(--surface);border:0.5px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.panel .p-t{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.panel .p-t .lnk{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer;border:none;background:none;padding:0}

/* ===== Home ===== */
.home-grid{display:flex;flex-direction:column;gap:14px}
.hgrid-top{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:stretch}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#1E8CFF,#0A68D6);border-radius:18px;padding:20px 24px;color:#fff;box-shadow:0 12px 30px rgba(0,122,255,.28)}
.hero.done{background:linear-gradient(135deg,#3BC45E,#1F9E45);box-shadow:0 12px 30px rgba(31,158,69,.28)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 16% -22%,rgba(255,255,255,.55),rgba(255,255,255,0) 58%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.18);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .h-l{margin-right:auto}
.hero .k{font-size:12.5px;font-weight:700;letter-spacing:.05em;opacity:.85}
.hero .t{font-size:23px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.hero .s{font-size:13px;opacity:.9;margin-top:3px}
.hero .btn{background:#fff;color:var(--blue);font-size:14.5px;padding:12px 22px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.today-strip{display:flex;align-items:stretch;background:var(--surface);border:0.5px solid var(--line);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden}
.today-strip .t-cell{display:flex;align-items:baseline;gap:6px;padding:11px 18px;flex:1;min-width:0}
.today-strip .t-cell .t-k{font-size:12px;font-weight:600;color:var(--ink3);flex-shrink:0}
.today-strip .t-cell .t-v{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.today-strip .t-cell .t-u{font-size:12px;color:var(--ink3)}
.today-strip .t-sep{width:0.5px;background:var(--line);flex-shrink:0}
.flow-card{background:var(--surface);border:0.5px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.flow-card .fc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.flow-card .fc-badge{font-size:12px;font-weight:800;color:#fff;background:var(--blue);border-radius:7px;padding:3px 9px;letter-spacing:.02em}
.flow-card .fc-book{font-size:13px;font-weight:800;color:var(--ink)}
.flow-card .fc-unit{font-size:12px;font-weight:600;color:var(--ink3);margin-left:auto}
.flow-card .fc-steps{display:flex;align-items:stretch;gap:8px}
.flow-card .fc-step{flex:1;border:0.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--gray6);text-align:left;transition:border-color .15s,box-shadow .15s}
.flow-card .fc-step:hover{border-color:var(--blue)}
.flow-card .fc-step.cur{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue);background:var(--blue-tint)}
.flow-card .fc-step.done{background:rgba(52,199,89,.07);border-color:rgba(52,199,89,.45)}
.flow-card .fc-name{font-size:13px;font-weight:800;color:var(--ink);display:flex;align-items:baseline;gap:6px}
.flow-card .fc-name i{font-style:normal;font-size:11px;font-weight:500;color:var(--ink3)}
.flow-card .fc-num{font-size:12px;font-weight:700;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.flow-card .fc-step.done .fc-name{color:#2FB257}
.flow-card .fc-bar{display:block;height:4px;border-radius:2px;background:var(--gray5);margin-top:9px;overflow:hidden}
.flow-card .fc-bar b{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.flow-card .fc-step.done .fc-bar b{background:#34C759}
.flow-card .fc-arrow{color:var(--ink3);font-size:14px;align-self:center}
.flow-card .fc-head select{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);background:var(--gray5);border:none;border-radius:8px;padding:6px 10px;outline:none;font-family:var(--sans);cursor:pointer;max-width:120px}
.flow-card .fc-foot{display:flex;gap:10px;margin-top:12px}
.flow-card .fc-foot .btn{flex:1;font-size:12.5px;padding:8px 10px}
.flow-card .fc-empty{color:var(--ink3);font-size:14px;text-align:center;padding:10px 0}
.hero.done .btn{color:var(--green)}
.book-drawer{display:flex;flex-direction:column;gap:14px;margin-top:6px;padding:16px 18px;background:var(--surface);border:0.5px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.05);animation:bkIn .3s cubic-bezier(.22,.9,.32,1)}
.bd-head{display:flex;align-items:center;gap:10px}
.bd-head .bd-t{font-size:16px;font-weight:800;color:var(--ink)}
.bd-head .bd-s{font-size:12.5px;color:var(--ink3)}
.bd-head .sp{flex:1}
.bd-head .btn{padding:6px 13px;font-size:12.5px;flex-shrink:0}
.series-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.s-card{background:var(--surface);border:0.5px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:transform .16s,box-shadow .16s;cursor:pointer}
.s-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
.s-card .s-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.s-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.s-card .s-name{font-weight:800;font-size:15px}
.s-card .s-sub{font-size:12px;color:var(--ink2)}
.s-ring{margin-left:auto;width:46px;height:46px;flex-shrink:0;transition:transform .18s}
.s-card:hover .s-ring{transform:scale(1.1)}
.s-bottom{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink2)}
.s-bottom .prog{flex:1}
.flow-card .fc-empty{cursor:pointer}
.flow-card .fc-empty:hover{color:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;padding-top:6px}
.bar{flex:1;background:var(--gray5);border-radius:5px 5px 2px 2px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.bar i{position:absolute;bottom:0;left:0;right:0;background:var(--accent);border-radius:5px 5px 2px 2px;transition:filter .15s}
.bar i.rev{background:var(--green);opacity:.5}
.bar:hover i{filter:brightness(1.15)}
.bar-label{position:relative;z-index:1;font-size:10px;color:var(--ink3);text-align:center;margin-top:auto;padding-top:4px;pointer-events:none}
.bar .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.bar:hover .tip{opacity:1}
.lg{display:flex;gap:16px;font-size:11.5px;color:var(--ink2);margin-top:10px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{text-align:center;color:var(--ink3);font-size:13.5px;padding:18px 0}

/* ===== Library ===== */
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{font-size:13.5px;font-weight:600;padding:8px 18px;border-radius:999px;background:var(--gray5);color:var(--ink2);border:none;cursor:pointer;transition:background .14s,color .14s}
.tab.on{background:var(--accent);color:#fff}
.filters{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.filters .flab{font-size:12.5px;color:var(--ink3);margin-right:4px}
.f-ch{font-size:12.5px;color:var(--ink2);padding:5px 11px;border-radius:8px;border:0.5px solid var(--line);background:var(--surface);cursor:pointer;transition:color .14s,border-color .14s}
.f-ch.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.view{display:flex;gap:2px;background:var(--gray5);border-radius:8px;padding:2px}
.view b{width:30px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--ink3);cursor:pointer;font-size:13px;user-select:none}
.view b.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.book{background:var(--surface);border:0.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:transform .16s,box-shadow .16s,border-color .16s}
.book:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.12);border-color:rgba(52,199,89,.55)}
.book .cover{transition:transform .16s}
.book:hover .cover{transform:translateY(-4px) rotate(-2deg)}
.book.locked{opacity:.72;cursor:default}
.book.locked:hover{transform:none;border-color:var(--line);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.book.locked:hover .cover{transform:none}
.b-arrow{opacity:0;transition:opacity .16s;color:var(--green);font-size:16px;font-weight:700}
.book:hover .b-arrow{opacity:1}
.book .b-top{display:flex;gap:13px;align-items:flex-start;margin-bottom:12px}
.cover{width:54px;height:72px;border-radius:9px;flex-shrink:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:7px;color:#fff;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.14)}
.cover::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,0))}
.cover::after{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:rgba(255,255,255,.4)}
.cover .cno{font-size:7.5px;font-weight:700;letter-spacing:.08em;opacity:.85;margin-bottom:2px}
.cover .ct{font-size:11px;font-weight:800;line-height:1.15}
.cover .lock{position:absolute;left:7px;top:6px;font-size:11px;opacity:.9}
.cover.c1{background:linear-gradient(160deg,#4EA6FF,#0A68D6)}
.cover.c2{background:linear-gradient(160deg,#57D973,#1F9E45)}
.cover.c3{background:linear-gradient(160deg,#7A79E6,#4644C4)}
.cover.locked{filter:saturate(.3) brightness(.88)}
.book .b-name{font-weight:800;font-size:15px}
.book .b-sub{font-size:12px;color:var(--ink2);margin-top:2px}
.book .b-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)}
.book .b-meta .prog{flex:1}
.book .b-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.book .b-foot .stat{font-size:12px;color:var(--ink2)}
.book .b-foot .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.book .b-foot .btn{flex-shrink:0}
.book-grid.list{display:flex;flex-direction:column;gap:10px}
.book-grid.list .book{display:flex;align-items:center;gap:18px}
.book-grid.list .b-top{margin-bottom:0;flex:0 0 auto;min-width:150px}
.book-grid.list .b-meta{flex:1;min-width:0}
.book-grid.list .b-foot{margin-top:0;flex:0 0 auto}

/* ===== 教材卡 / 通用按钮 ===== */
.btn.ghost{background:transparent;border:0.5px solid var(--line);color:var(--ink2)}
.btn.ghost.danger{border-color:var(--red);color:var(--red)}
.seg{display:flex;gap:4px;background:var(--gray5);border-radius:9px;padding:3px}
.seg b{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:7px;color:var(--ink2);transition:background .15s,color .15s;cursor:pointer;user-select:none}
.seg b:hover{color:var(--accent)}
.seg b.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pill{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;background:var(--gray5);color:var(--ink2);cursor:pointer;border:none;transition:background .14s,color .14s}
.pill.on{background:var(--accent);color:#fff}
.tinput{width:64px;font-size:13px;padding:6px 8px;border-radius:8px;border:0.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;font-family:var(--sans)}
.tinput.err{border-color:var(--red);background:var(--red-tint)}
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:flex;align-items:center;gap:13px;background:var(--surface);border:0.5px solid var(--line);border-radius:14px;padding:11px 15px;box-shadow:0 1px 3px rgba(0,0,0,.03);transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
.unit:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.08);border-color:var(--accent)}
.unit .u-no{width:34px;height:34px;border-radius:9px;background:var(--gray5);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--ink2);flex-shrink:0}
.unit.done .u-no{background:var(--green-tint);color:var(--green)}
.unit .u-info{flex:1;min-width:0}
.unit .u-name{font-size:14px;font-weight:700}
.unit .u-sub{font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.unit .u-prog{width:34px;height:4px;border-radius:2px;background:var(--gray5);overflow:hidden;flex-shrink:0}
.unit .u-prog i{display:block;height:100%;border-radius:2px;background:var(--accent)}

/* ===== Stats ===== */
.stats-grid{display:flex;flex-direction:column;gap:14px}
.stat-actions{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat-actions .hard-count{font-size:12px;font-weight:700;background:rgba(255,149,0,.16);color:var(--orange);border-radius:999px;padding:1px 8px;margin-left:2px}
.stat-hint{font-size:12px;color:var(--ink3)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:0.5px solid var(--line);border-radius:16px;padding:15px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:transform .16s,box-shadow .16s;cursor:pointer}
.kpi:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.1)}
.kpi .k-t{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .k-v{font-size:30px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.charts{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
.chart{background:var(--surface);border:0.5px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.chart .c-t{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:14px}
.chart .c-t .seg{display:flex;gap:4px;background:var(--gray5);border-radius:8px;padding:3px}
.chart .c-t .seg b{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;color:var(--ink2);transition:background .15s,color .15s;cursor:pointer}
.chart .c-t .seg b:hover{color:var(--accent)}
.chart .c-t .seg b.on{background:#fff;color:var(--accent)}
.line{display:flex;align-items:flex-end;gap:7px;height:130px;border-bottom:0.5px solid var(--line);padding:0 4px}
.line .col{flex:1;display:flex;align-items:flex-end;gap:3px;height:100%}
.line .col i{flex:1;border-radius:4px 4px 1px 1px;background:var(--accent);min-height:3px;transition:filter .15s;position:relative}
.line .col i.r{background:var(--green);opacity:.5}
.line .col:hover i{filter:brightness(1.16)}
.line .col i .tip{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.line .col:hover i .tip{opacity:1}
.dist{display:flex;flex-direction:column;gap:10px}
.dist-row{display:flex;align-items:center;gap:10px;font-size:12.5px;transition:transform .14s;cursor:pointer}
.dist-row:hover{transform:translateX(3px)}
.dist-row .d-l{width:56px;font-weight:600;color:var(--ink2)}
.dist-row .prog{flex:1}
.dist-row .d-v{width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.scomp-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:0.5px solid var(--line);font-size:13px;transition:transform .14s;cursor:pointer}
.scomp-row:hover{transform:translateX(3px)}
.scomp-row:last-child{border-bottom:none}
.scomp-row .sn{width:86px;font-weight:700}
.scomp-row .prog{flex:1}
.scomp-row .sv{width:52px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ===== Settings ===== */
.set-layout{display:grid;grid-template-columns:236px 1fr;gap:16px}
.sg{background:var(--surface);border:0.5px solid var(--line);border-radius:16px;overflow:hidden;align-self:start;box-shadow:0 1px 4px rgba(0,0,0,.04);position:sticky;top:8px}
.sg a{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--ink2);border-bottom:0.5px solid var(--line);text-decoration:none;transition:background .14s,color .14s;cursor:pointer;width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none}
.sg a:hover{background:var(--gray5);color:var(--ink)}
.sg a.on{color:var(--accent);background:var(--accent-tint,rgba(0,122,255,.12))}
.set-panel{background:var(--surface);border:0.5px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.set-panel h4{font-size:15px;font-weight:800;margin-bottom:14px;padding-bottom:10px;border-bottom:0.5px solid var(--line)}
.set-row{display:flex;align-items:center;gap:14px;padding:13px 8px;border-bottom:0.5px solid var(--line);transition:background .14s;border-radius:8px}
.set-row:hover{background:var(--gray6)}
.set-row:last-child{border-bottom:none}
.set-row .s-info{flex:1;min-width:0}
.set-row .s-t{font-size:14px;font-weight:700}
.set-row .s-d{font-size:12px;color:var(--ink2)}
.set-row .set-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill.stat{cursor:default;white-space:nowrap}
.pill.stat.on{background:var(--green-tint);color:var(--green)}
.pill.stat.off{background:var(--gray5);color:var(--ink3)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--green);position:relative;flex-shrink:0;transition:background .2s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.off{background:var(--gray5)}
.switch.off::after{right:auto;left:2px}
.choice{display:flex;gap:6px}
.choice b{font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:9px;background:var(--gray5);color:var(--ink2);transition:background .15s,color .15s;cursor:pointer}
.choice b:hover{color:var(--accent)}
.choice b.on{background:var(--accent);color:#fff}
.field-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:420px}
.ftag{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;background:var(--accent-tint,rgba(0,122,255,.12));color:var(--accent);border:1px solid var(--accent);cursor:pointer;transition:filter .14s,transform .14s}
.ftag:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ftag.dim{background:var(--gray5);color:var(--ink3);border-color:transparent}
.danger{background:var(--red-tint);color:var(--red);border-color:transparent}
.danger.dim{background:var(--gray5);color:var(--ink3)}

/* ===== Study overlay ===== */
#study{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}
#study.open{display:flex}
.study-top{height:52px;flex-shrink:0;display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--glass);backdrop-filter:blur(34px) saturate(1.8);-webkit-backdrop-filter:blur(34px) saturate(1.8);border-bottom:0.5px solid rgba(60,60,67,.14);position:relative;box-shadow:inset 0 -1px 0 rgba(255,255,255,.5)}
.study-top::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(255,255,255,0));pointer-events:none}
.study-top .back{font-size:20px;color:var(--accent);font-weight:600;cursor:pointer;background:none;border:none;padding:0 6px 0 0}
.study-top .ttl{font-size:14.5px;font-weight:800}
.study-top .sub{font-size:12px;color:var(--ink2)}
.study-top .prog-track{width:180px;height:6px;border-radius:3px;background:var(--gray5);overflow:hidden;flex-shrink:0}
.study-top .prog-track i{display:block;height:100%;background:var(--accent);transition:width .2s}
.study-top .stages{display:flex;gap:5px;align-items:center;flex-shrink:0;max-width:46%;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.study-top .stages::-webkit-scrollbar{display:none}
.study-top .st{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink3);padding:4px 10px;border-radius:999px;background:var(--gray5);transition:all .18s;user-select:none;white-space:nowrap;flex-shrink:0}
.study-top .st i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--gray6);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.study-top .st .sf{font-size:9px;opacity:.72;font-weight:600}
.study-top .st.b1{box-shadow:inset 0 -2px 0 rgba(0,122,255,.35)}
.study-top .st.b2{box-shadow:inset 0 -2px 0 rgba(88,86,214,.35)}
.study-top .st.b3{box-shadow:inset 0 -2px 0 rgba(52,199,89,.4)}
.study-top .st.done{color:var(--green);background:rgba(52,199,89,.14)}
.study-top .st.done i{background:var(--green);color:#fff}
.study-top .st.cur{color:#fff;background:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.16)}
.study-top .st.cur i{background:rgba(255,255,255,.28);color:#fff}
.study-top .spacer{flex:1}
.study-top .wlbtn{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--gray5);border:none;border-radius:9px;padding:7px 12px;cursor:pointer;transition:background .14s,color .14s;flex-shrink:0}
.study-top .wlbtn:hover{color:var(--accent)}
.study-top .wlbtn.on{color:var(--accent);background:var(--accent-tint,rgba(0,122,255,.12))}
.study-body{position:relative;flex:1;min-height:0;overflow:hidden}
.wordlist{position:absolute;top:0;left:0;bottom:0;width:min(256px,82vw);transform:translateX(-105%);transition:transform .22s cubic-bezier(.22,.9,.32,1);z-index:60;border-right:0.5px solid rgba(60,60,67,.14);background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);display:flex;flex-direction:column;min-height:0;box-shadow:0 12px 34px rgba(0,0,0,.16)}
.wordlist.open{transform:none}
.wl-head{padding:14px 16px 10px;font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--ink3);border-bottom:0.5px solid rgba(60,60,67,.12);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.wl-head .drawer-btn{display:none}
.wl{flex:1;overflow-y:auto;padding:6px}
.wl-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13.5px;transition:background .14s;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--ink)}
.wl-item:hover{background:rgba(0,0,0,.04)}
.wl-item .no{width:20px;font-size:11px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.wl-item .w{font-weight:700;flex:1}
.wl-item .w.hidden{color:var(--ink3);font-weight:500;letter-spacing:.15em;user-select:none}
.wl-item.cur{background:var(--accent-tint,rgba(0,122,255,.12));color:var(--accent)}
.wl-item.cur .w{color:var(--accent)}
.wl-item .ck{color:var(--green);font-size:13px;flex-shrink:0}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;position:relative;min-height:0;height:100%;overflow:hidden}
.card{width:min(430px,74%);background:#FFF;border-radius:24px;box-shadow:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.16);overflow:hidden;position:relative;cursor:pointer;transition:transform .18s,min-height .3s;min-height:300px}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% -18%,rgba(255,255,255,.6),rgba(255,255,255,0) 58%);pointer-events:none}
.card::after{content:"";position:absolute;inset:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.04);pointer-events:none}
.card>*{position:relative;z-index:1}
.card:hover{transform:translateY(-2px)}
.card .c-front{padding:36px 34px 32px;text-align:center;display:flex;flex-direction:column;min-height:300px;justify-content:center}
.card .c-unit{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--accent);margin-bottom:16px}
.card .c-word{font-size:var(--cword);font-weight:800;letter-spacing:-.8px;line-height:1.1;word-break:break-word}
.card .c-hint{font-size:12.5px;color:var(--ink3);margin-top:24px;display:flex;align-items:center;justify-content:center;gap:6px}
.card .c-hint .spk{width:20px;height:20px;border-radius:6px;background:var(--gray5);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.card .c-back{padding:30px 32px;text-align:center;display:none;flex-direction:column;min-height:300px;justify-content:center}
.card.flip .c-front{display:none}
.card.flip .c-back{display:flex}
.c-pro{font-size:var(--cpro);font-weight:800;letter-spacing:-.4px}
.c-pro .part{font-size:var(--cpro-p);font-weight:700;color:var(--accent)}
.c-audio{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.c-audio b{font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:9px;background:var(--accent-tint,rgba(0,122,255,.12));color:var(--accent);transition:filter .15s,transform .15s;cursor:pointer}
.c-audio b:hover{filter:brightness(1.07);transform:translateY(-1px)}
.c-def{font-size:var(--cdef);font-weight:700;color:var(--ink);margin-bottom:6px}
.c-cn{font-size:var(--ccn);color:var(--ink2);margin-bottom:16px}
.c-ex{background:var(--gray6);border-radius:12px;padding:12px 15px;font-size:var(--cex);color:var(--ink)}
.c-ex .cn{display:block;color:var(--ink2);font-size:var(--cex-cn);margin-top:4px}
.rate{display:flex;gap:10px;width:min(430px,74%)}
.rate b{flex:1;text-align:center;font-size:16.5px;font-weight:700;padding:16px 0;border-radius:14px;cursor:pointer;transition:transform .13s,box-shadow .13s;user-select:none;min-height:52px;display:flex;align-items:center;justify-content:center}
.rate b:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.rate b:active{transform:translateY(0) scale(.97)}
.rate .r1{background:var(--red-tint);color:var(--red)}
.rate .r2{background:var(--orange-tint);color:#C77700}
.rate .r3{background:var(--green-tint);color:#1F9E45}
.rate .r4{background:var(--blue-tint);color:var(--blue)}
.kbd{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--ink3);display:flex;gap:14px;white-space:nowrap}
.kbd i{font-style:normal;background:var(--gray5);border-radius:5px;padding:2px 7px;border:0.5px solid rgba(60,60,67,.18)}

/* spell input */
.spell-box{width:min(430px,74%);display:none;flex-direction:column;gap:10px}
.spell-box.show{display:flex}
.spell-box .s-prompt{text-align:center}
.spell-box .s-cn{font-size:20px;font-weight:700}
.spell-box .s-ph{font-size:13px;color:var(--ink2);margin-top:2px}
.spell-box .s-slots{position:relative;cursor:text;background:var(--gray5);border-radius:12px;padding:6px 8px}
.spell-box .s-box{display:flex;flex-wrap:wrap;gap:4px 7px;justify-content:center;align-items:flex-end;min-height:32px}
.spell-box .s-slots .s-ghost{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;background:transparent;font-size:16px;pointer-events:none}
.spell-box .s-slots i.caret{width:2px;min-width:2px;height:30px;border-bottom:0;background:var(--accent);border-radius:1px;animation:spBlink 1s steps(1) infinite}
@keyframes spBlink{50%{opacity:.15}}
.spell-box .s-slots i{font-style:normal;font-family:var(--mono);min-width:17px;height:32px;line-height:30px;text-align:center;font-size:18px;font-weight:600;color:var(--ink);border-bottom:2px solid var(--line2)}
.spell-box .s-slots i.space{min-width:18px;border-bottom-color:transparent}
.spell-box .s-slots i.lit{color:var(--ink2);border-bottom-color:transparent}
.spell-box .s-slots i.filled{border-bottom-color:var(--accent);color:var(--accent)}
.spell-box .s-slots i.good{border-bottom-color:var(--green);color:var(--green)}
.spell-box .s-feed{display:none;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.spell-box .s-feed.show{display:flex}
.spell-box .s-feed i{font-style:normal;width:10px}
.spell-box .s-feed b{font-style:normal;font-family:var(--mono);width:28px;height:34px;line-height:34px;text-align:center;border-radius:7px;font-size:17px;font-weight:700;background:var(--gray5);color:var(--ink)}
.spell-box .s-feed b.ok{background:var(--green);color:#fff}
.spell-box .s-feed b.miss{background:var(--red-tint);color:var(--red)}
.spell-box .s-ans{font-size:15px;font-weight:700;color:var(--red);display:none}
.spell-box .s-ans.show{display:block}
.spell-box .s-act{display:flex;gap:10px;justify-content:center}
.spell-box .s-hint{font-size:12.5px;color:var(--ink3);text-align:center}

/* 句子中目标词高亮 */
.w-hl{background:rgba(0,122,255,.13);color:var(--accent);font-weight:700;border-radius:4px;padding:0 3px;box-shadow:inset 0 -2px 0 rgba(0,122,255,.55)}
.w-hl.ok{background:rgba(52,199,89,.16);color:#1F9E45;box-shadow:inset 0 -2px 0 rgba(52,199,89,.6)}
.w-hl .wcp{border-bottom:1.5px dotted rgba(0,122,255,.6)}
[data-theme="dark"] .w-hl{color:#64B0FF}
[data-theme="dark"] .w-hl.ok{color:#5BD07C}

/* F1 音形对应 */
.snd-box{display:none;width:min(600px,92%);flex-direction:column;align-items:center;gap:16px;text-align:center}
.snd-box.show{display:flex}
.snd-box .snd-ph{font-family:var(--mono);font-size:clamp(15px,2.6vw,22px);color:var(--ink2)}
.snd-box .snd-rows{display:flex;flex-direction:column;gap:10px;width:100%}
.snd-box .snd-hint{font-size:12.5px;color:var(--ink3)}
.snd-box .snd-grow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:stretch}
.snd-box .snd-g{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:56px;padding:10px 12px;border:2px dashed var(--line2);border-radius:14px;cursor:pointer;transition:border-color .14s,background .14s,transform .14s;background:var(--gray6)}
.snd-box .snd-g:hover{border-color:var(--accent)}
.snd-box .snd-g .g-letters{font-size:var(--snd-letter);font-weight:800;line-height:1.1;color:var(--ink)}
.snd-box .snd-g .g-meta{font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.05em}
.snd-box .snd-g .g-phons{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.snd-box .snd-g .g-ph{font-family:var(--mono);font-size:var(--snd-phone);font-weight:700;padding:3px 9px;border-radius:8px;background:var(--gray5);color:var(--ink2)}
.snd-box .snd-g .g-ph.vow{background:rgba(255,69,58,.13);color:#DC2626}
.snd-box .snd-g .g-ph.cons{background:rgba(0,122,255,.12);color:#2563EB}
.snd-box .snd-g.done{border-style:solid;border-color:var(--green);background:rgba(52,199,89,.07)}
.snd-box .snd-g.done .g-ph{background:rgba(52,199,89,.16);color:#1F9E45}
.snd-box .snd-g.wrong{animation:shakeX .4s ease}
.snd-box .snd-g.target{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,149,0,.35)}
.snd-box .snd-tray{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:56px}
.snd-box .snd-p{font-family:var(--mono);font-size:var(--snd-phone);font-weight:700;padding:10px 16px;border-radius:12px;cursor:pointer;user-select:none;transition:transform .12s,box-shadow .12s;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.snd-box .snd-p.vow{background:rgba(255,69,58,.13);color:#DC2626;border:1.5px solid rgba(255,69,58,.35)}
.snd-box .snd-p.cons{background:rgba(0,122,255,.12);color:#2563EB;border:1.5px solid rgba(0,122,255,.3)}
.snd-box .snd-p:hover{transform:translateY(-2px)}
.snd-box .snd-p.sel{transform:translateY(-4px) scale(1.06);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.snd-box .snd-p.vow.sel{border-color:#DC2626}
.snd-box .snd-p.cons.sel{border-color:#2563EB}
.snd-box .snd-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.snd-box .snd-acts .btn{min-height:48px;font-size:16px;padding:11px 22px;border-radius:12px}
.snd-box .snd-feed{min-height:20px;font-size:13px;font-weight:700}
.snd-box .snd-feed.ok{color:var(--green)}
.snd-box .snd-feed.no{color:var(--red)}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* F4 句中填空 */
.blk-box{display:none;width:min(600px,92%);flex-direction:column;gap:12px;align-items:center;text-align:center}
.blk-box.show{display:flex}
.blk-box .blk-cn{font-size:clamp(15px,2.4vw,21px);color:var(--ink2);font-weight:600}
.blk-box .blk-sent{font-size:var(--sent);line-height:1.6;font-weight:600;color:var(--ink)}
.blk-box .blk-sent .blank{color:var(--accent);font-weight:800;letter-spacing:.04em}
.blk-box .blk-input{font-size:var(--slot);font-weight:700;text-align:center;width:min(360px,84%);padding:12px 16px;border-radius:14px;border:2px solid var(--line2);background:var(--surface);color:var(--ink);outline:none;font-family:var(--sans)}
.blk-box .blk-input:focus{border-color:var(--accent)}
.blk-box .blk-input.err{border-color:var(--red);animation:shakeX .4s ease}
.blk-box .blk-acts{display:flex;gap:10px;justify-content:center}
.blk-box .blk-acts .btn{min-height:48px;font-size:16px;padding:11px 24px;border-radius:12px}
.blk-box .blk-feed{min-height:22px;font-size:14px;font-weight:700}
.blk-box .blk-feed.ok{color:var(--green)}
.blk-box .blk-feed.no{color:var(--red)}

/* F5 句子翻译 */
.tr-box{display:none;width:min(640px,94%);flex-direction:column;gap:12px;align-items:center}
.tr-box.show{display:flex}
.tr-box .tr-cn{font-size:var(--sent);line-height:1.6;font-weight:600;text-align:center;color:var(--ink)}
.tr-box .tr-target{display:flex;align-items:center;gap:8px;font-size:clamp(15px,2.4vw,21px);font-weight:700;color:var(--accent);flex-wrap:wrap;justify-content:center}
.tr-box .tr-target .t-ph{font-family:var(--mono);font-size:clamp(14px,2.2vw,19px);color:var(--ink2);font-weight:600}
.tr-box .tr-input{font-size:clamp(17px,2.6vw,23px);line-height:1.55;width:100%;min-height:110px;padding:14px 16px;border-radius:14px;border:2px solid var(--line2);background:var(--surface);color:var(--ink);outline:none;resize:vertical;font-family:var(--sans)}
.tr-box .tr-input:focus{border-color:var(--accent)}
.tr-box .tr-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tr-box .tr-acts .btn{min-height:48px;font-size:16px;padding:11px 24px;border-radius:12px}
.tr-box .tr-feed{min-height:22px;font-size:14px;font-weight:700}
.tr-box .tr-feed.ok{color:var(--green)}
.tr-box .tr-feed.no{color:var(--red)}
.tr-box .tr-ref{display:none;width:100%;text-align:left;background:var(--gray6);border-radius:14px;padding:14px 18px;font-size:clamp(17px,2.6vw,23px);line-height:1.6;color:var(--ink)}
.tr-box .tr-ref.show{display:block}
.tr-box .tr-ref .r-lbl{font-size:12px;font-weight:800;color:var(--ink3);margin-bottom:6px;letter-spacing:.04em}
.tr-box .tr-ref .r-miss{font-size:13px;color:var(--orange);margin-top:8px}

/* completion */
.complete{display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
.complete.show{display:flex}
.complete .c-ico{font-size:56px}
.complete .c-t{font-size:26px;font-weight:800}
.complete .c-s{font-size:14px;color:var(--ink2)}
.complete .c-acts{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center}

/* ===== Modal / Toast / Banner ===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.dialog{background:var(--surface);border-radius:18px;width:min(380px,88vw);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.dialog .d-t{font-size:17px;font-weight:800;margin-bottom:8px;text-align:center}
.dialog .d-s{font-size:13.5px;color:var(--ink2);margin-bottom:18px;text-align:center;line-height:1.5}
.dialog .d-acts{display:flex;gap:10px}
.dialog .d-acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:rgba(28,28,30,.92);color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:11px;z-index:300;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.reminder-banner{display:none;align-items:center;gap:12px;background:var(--orange-tint);border:0.5px solid rgba(255,149,0,.35);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.reminder-banner.show{display:flex}
.reminder-banner .r-t{font-size:14px;font-weight:700;color:#C77700}
.reminder-banner .r-s{font-size:12.5px;color:var(--ink2)}
.reminder-banner .btn{padding:7px 16px;font-size:13px;flex-shrink:0}
.reminder-banner .x{margin-left:auto;background:none;border:none;font-size:16px;color:var(--ink3);cursor:pointer;flex-shrink:0}

/* ===== Welcome（仅首次启动） ===== */
.wl-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 0 6px}
.wl-logo .dot{width:52px;height:52px;font-size:24px;margin:0 0 12px}
.wl-title{font-size:21px;font-weight:800}
.wl-sub{font-size:13px;color:var(--ink2);max-width:340px}
.wl-label{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.04em;margin:22px 0 10px}
.wl-foot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:22px}
.wl-foot .btn{font-size:14px;padding:11px 34px;border-radius:12px}
.wl-foot .btn:disabled{opacity:.45;cursor:default}
.wl-note{font-size:12px;color:var(--ink3)}
.book.sel{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.book.cur{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}

/* ===== 动画效果（欢迎页 + 切换教材抽屉） ===== */
@keyframes wlUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes wlPop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
@keyframes wlLogo{0%{opacity:0;transform:scale(0) rotate(-35deg)}70%{transform:scale(1.08) rotate(6deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes wlReady{0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.12)}50%{box-shadow:0 6px 26px rgba(0,0,0,.3)}}
@keyframes cardIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes bkIn{0%{opacity:0;transform:translateY(-16px) scale(.98)}60%{opacity:1;transform:translateY(3px)}100%{opacity:1;transform:none}}
@keyframes bkOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px) scale(.985)}}

#screen-welcome .wl-hero{animation:wlPop .5s cubic-bezier(.2,.8,.3,1)}
#screen-welcome .wl-logo .dot{animation:wlLogo .55s cubic-bezier(.2,1.3,.4,1) .04s backwards}
#screen-welcome .wl-label{animation:wlUp .5s cubic-bezier(.2,.8,.3,1)}
#screen-welcome #wlSeries{animation:wlUp .5s cubic-bezier(.2,.8,.3,1)}
#screen-welcome #wlBooks{animation:wlUp .5s cubic-bezier(.2,.8,.3,1)}
#screen-welcome .wl-foot{animation:wlUp .5s cubic-bezier(.2,.8,.3,1)}
#screen-welcome .wl-label:nth-of-type(2){animation-delay:.1s}
#screen-welcome #wlSeries{animation-delay:.16s}
#screen-welcome .wl-label:nth-of-type(4){animation-delay:.24s}
#screen-welcome #wlBooks{animation-delay:.3s}
#screen-welcome .wl-foot{animation-delay:.38s}
#wlStart:not(:disabled){animation:wlReady 2s ease-in-out infinite}
.book-drawer.closing{animation:bkOut .19s ease forwards}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ===== Responsive ===== */
@media (max-width:767px){
  .topbar{padding:10px 14px;gap:8px}
  .topbar .logo{font-size:14px}
  .top-tabs{margin-left:0}
  .top-tabs .tab{padding:7px 12px;font-size:13px}
  .page-title{padding:18px 18px 6px;font-size:24px}
  .page-title .btn{font-size:12px;padding:6px 11px}
  .page-content{padding:8px 18px 20px}
  .series-row{grid-template-columns:1fr}
  .hgrid-top{grid-template-columns:1fr}
  .today-strip{flex-wrap:wrap}
  .today-strip .t-sep{display:none}
  .charts{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .book-grid{grid-template-columns:repeat(2,1fr)}
  .set-layout{grid-template-columns:1fr}
  .sg{position:static;display:flex;overflow-x:auto}
  .sg a{border-bottom:none;border-right:0.5px solid var(--line);white-space:nowrap}
  .study-body{grid-template-columns:1fr}
  .study-top .prog-track{width:90px}
  .study-top .st{padding:4px 7px;font-size:11px}
  .study-top .st i{width:14px;height:14px;font-size:9px}
  .wordlist{position:absolute;top:52px;left:0;right:0;bottom:auto;border-right:none;border-bottom:0.5px solid var(--line);z-index:90;box-shadow:0 12px 30px rgba(0,0,0,.12)}
  .wordlist .wl{max-height:0;overflow:hidden auto;transition:max-height .25s}
  .wordlist.open .wl{max-height:45vh}
  .wl-head .drawer-btn{display:block;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer}
  #study{position:fixed}
  .stage{padding:16px}
  .card{width:88%}
  .card .c-word{font-size:var(--cword-s)}
  .rate{width:88%}
  .card .c-front,.card .c-back{min-height:240px}
  .kbd{display:none}
  .spell-box{width:88%}
  .flow-card .fc-steps{flex-direction:column}
  .flow-card .fc-arrow{transform:rotate(90deg);align-self:center}
  .flow-card .fc-foot{flex-direction:column}
}
/* ===== 统计范围切换 ===== */
.stats-seg{display:flex;justify-content:flex-end;margin-bottom:14px}
.stats-seg .seg b{padding:6px 16px;font-size:13px}
.sb-choose{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.sb-choose select{font-size:12.5px;font-weight:600;color:var(--accent);background:var(--gray5);border:none;border-radius:8px;padding:6px 10px;outline:none;font-family:var(--sans);cursor:pointer}
.sb-unit-list{display:flex;flex-direction:column;gap:8px}
.sb-unit-list .unit{cursor:default}
.sb-unit-list .unit:hover{transform:none;box-shadow:none}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo"><span class="dot" id="logoDot">词</span>词书架</div>
    <nav class="top-tabs">
      <button class="tab" data-screen="library">学习</button>
      <button class="tab" data-screen="stats">统计</button>
      <button class="tab" data-screen="settings">设置</button>
    </nav>
    <span class="spacer"></span>
  </header>
  <main class="main">
    <!-- ===== Welcome（仅首次启动） ===== -->
    <section id="screen-welcome" class="screen">
      <div class="page-content">
        <div class="wl-hero">
          <div class="wl-logo"><span class="dot" id="wlDot">词</span></div>
          <div class="wl-title">欢迎使用词书架</div>
          <div class="wl-sub">选择你的教材系列与分册，开始每日学习之旅</div>
        </div>
        <div class="wl-label">1 · 选择系列</div>
        <div class="tabs" id="wlSeries"></div>
        <div class="wl-label">2 · 选择分册</div>
        <div class="book-grid" id="wlBooks"></div>
        <div class="wl-foot">
          <button class="btn" id="wlStart" disabled>请先选择教材</button>
          <div class="wl-note" id="wlNote"></div>
        </div>
      </div>
    </section>

    <!-- ===== Library（当前书工作台 + 切换教材抽屉） ===== -->
    <section id="screen-library" class="screen">
      <div class="page-title"><span>学习</span><span class="sp"></span><button class="btn ghost danger" id="resetBookBtn">重置本册</button><button class="btn ghost" id="switchBookBtn">切换教材</button></div>
      <div class="page-content">
        <div class="reminder-banner" id="reminderBanner">
          <div><div class="r-t" id="remTitle"></div><div class="r-s" id="remSub"></div></div>
          <button class="btn" id="remGo">去复习</button>
          <button class="x" id="remClose">✕</button>
        </div>
        <div class="home-grid">
          <div class="hgrid-top">
            <div class="hero" id="hero">
              <div class="h-l">
                <div class="k" id="heroK">今日学习计划</div>
                <div class="t" id="heroT">加载中…</div>
                <div class="s" id="heroS"></div>
              </div>
              <button class="btn" id="heroBtn">继续学习 →</button>
            </div>
            <div class="flow-card" id="flowCard"></div>
          </div>
          <div class="today-strip">
            <div class="t-cell"><span class="t-k">今日目标</span><span class="t-v" id="todayBadge">0</span><span class="t-u" id="todayGoalTxt">/20 词</span></div>
            <span class="t-sep"></span>
            <div class="t-cell"><span class="t-k">连续学习</span><span class="t-v">🔥 <span id="streakNum">0</span></span><span class="t-u">天</span></div>
          </div>
        </div>
        <!-- 切换教材抽屉（默认收起，点「切换教材」展开） -->
        <div class="book-drawer" id="bookDrawer" style="display:none">
          <div class="bd-head">
            <div class="bd-t">选择教材</div>
            <div class="bd-s" id="bdMeta"></div>
            <span class="sp"></span>
            <button class="btn ghost" id="bdClose">收起 ✕</button>
          </div>
          <div class="tabs" id="libTabs"></div>
          <div class="filters">
            <span class="flab">选择当前学习的教材</span>
            <span style="flex:1"></span>
            <span style="font-size:12.5px;color:#AEAEB2" id="libMeta"></span>
          </div>
          <div class="book-grid" id="bookGrid"></div>
        </div>
      </div>
    </section>

    <!-- ===== Stats ===== -->
    <section id="screen-stats" class="screen">
      <div class="page-title">统计</div>
      <div class="page-content">
        <div class="stat-actions">
          <button class="btn tint" id="hardReview">💪 难词攻克 <span id="hardCount" class="hard-count"></span></button>
          <span class="stat-hint" id="hardHint">按遗忘次数聚合的易错词</span>
        </div>
        <div class="stats-seg" id="statsSeg"><div class="seg"><b class="on" data-scope="book">本教材</b><b data-scope="global">全局</b></div></div>
        <!-- 本教材模块 -->
        <div class="stats-grid" id="statBook">
          <div class="sb-choose" id="sbChoose"><span class="flab">范围</span><select id="sbSeries"></select><select id="sbBook"></select></div>
          <div class="kpis" id="sbKpis"></div>
          <div class="chart">
            <div class="c-t">本教材学习量 <span class="seg" id="sbSeg"><b class="on" data-days="7">近 7 天</b><b data-days="30">近 30 天</b></span></div>
            <div class="bars" id="sbBars"></div>
            <div class="lg"><span><i style="background:#007AFF"></i>新增</span><span><i style="background:#34C759;opacity:.5"></i>复习</span></div>
          </div>
          <div class="chart">
            <div class="c-t">单元进度</div>
            <div class="sb-unit-list" id="sbUnits"></div>
          </div>
        </div>
        <!-- 全局模块 -->
        <div class="stats-grid" id="statGlobal" style="display:none">
          <div class="kpis" id="kpis"></div>
          <div class="charts">
            <div class="chart">
              <div class="c-t">学习曲线 <span class="seg" id="statSeg"><b class="on" data-days="7">近 7 天</b><b data-days="30">近 30 天</b></span></div>
              <div class="line" id="statLine"></div>
              <div class="lg"><span><i style="background:#5856D6"></i>新增</span><span><i style="background:#34C759;opacity:.5"></i>复习</span></div>
            </div>
            <div class="chart">
              <div class="c-t">掌握度分布</div>
              <div class="dist" id="distBox"></div>
            </div>
          </div>
          <div class="chart">
            <div class="c-t">系列进度对比</div>
            <div id="scompBox"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Settings ===== -->
    <section id="screen-settings" class="screen">
      <div class="page-title">设置</div>
      <div class="page-content">
        <div class="set-layout">
          <div class="sg" id="setNav"></div>
          <div class="set-panel" id="setPanel"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ===== Study overlay ===== -->
<div id="study">
  <div class="study-top">
    <button class="back" id="studyBack">‹</button>
    <div><div class="ttl" id="studyTtl"></div><div class="sub" id="studySub"></div></div>
    <div class="stages" id="studyStages" style="display:none">
      <span class="st" data-s="0"><i>1</i>音形</span><span class="st" data-s="1"><i>2</i>词卡</span><span class="st" data-s="2"><i>3</i>听写</span><span class="st" data-s="3"><i>4</i>填空</span><span class="st" data-s="4"><i>5</i>翻译</span>
    </div>
    <div class="prog-track"><i id="studyProg"></i></div>
    <span class="spacer"></span>
    <button class="wlbtn" id="wlBtn" aria-pressed="false">▤ 词表</button>
    <button class="btn gray" style="padding:7px 14px;font-size:13px" id="studyExit">退出</button>
  </div>
  <div class="study-body">
    <div class="wordlist" id="studyWl">
      <div class="wl-head"><span id="wlTitle"></span><button class="drawer-btn" id="wlToggle">词表 ▾</button></div>
      <div class="wl" id="wlItems"></div>
    </div>
    <div class="stage">
      <div class="card" id="studyCard">
        <div class="c-front">
          <div class="c-unit" id="cUnit"></div>
          <div class="c-word" id="cWord"></div>
          <div class="c-hint"><span class="spk">♫</span> 点击翻面查看释义</div>
        </div>
        <div class="c-back" id="cBack"></div>
      </div>

const cache = {};
async function loadBook(id){
  if(cache[id]) return cache[id];
  const b = BOOKS.find(x=>x.id===id);
  if(!b) return null;
  const res = await fetch(b.dataFile);
  if(!res.ok) throw new Error('HTTP '+res.status);

/* ===================== Progress & Schedule (P0) ===================== */
function getProgress(){
  if(!App.progress) App.progress = store.get('v14progress',{});
  return App.progress;
}
function saveProgress(){ store.set('v14progress', App.progress||{}); }
function migrateLegacyProgress(){
  const existing=store.get('v14progress',null);
  if(existing && Object.keys(existing).length) return;
  const progress={};
  let migrated=0;
  BOOKS.forEach(book=>{
    const legacy=store.get('anki_'+book.id+'_state',null);
    if(!legacy || !legacy.cards) return;
    const words={};
    Object.entries(legacy.cards).forEach(([wid,c])=>{
      if(!c || !c.lastReview || c.state==='new') return;
      const interval=Math.max(1,Number(c.interval)||1);
      words[wid]={
        interval,
        streak:c.state==='review'?Math.min(6,Math.max(1,Math.floor(Math.log2(interval+1)))):0,
        lapses:c.state==='relearning'?1:0,
        nextReview:Number(c.due)||Date.now(),
        mastered:c.state==='review'&&interval>=15,
        reviewCount:Number(c.reps)||0,
        lastRate:3,
        lastReview:Number(c.lastReview),
        learnedAt:Number(c.lastReview),
        spellStreak:0,dictatedAt:0,spelledAt:0,soundAt:0,
        blankAt:0,transAt:0,transStreak:0
      };
      migrated++;
    });
    if(Object.keys(words).length) progress[book.id]={words};
  });
  if(migrated){
    store.set('v14progress',progress);
    store.set('v14legacyMigratedAt',Date.now());
  }
}
function getBookProg(id){ const p=getProgress(); if(!p[id]) p[id]={words:{}}; return p[id]; }
function getWordState(bookId, wid){
  const bp=getBookProg(bookId);
  if(!bp.words[wid]) bp.words[wid]={interval:0,streak:0,lapses:0,nextReview:0,mastered:false,reviewCount:0,lastRate:0,lastReview:0,learnedAt:0,spellStreak:0,dictatedAt:0,spelledAt:0,soundAt:0,blankAt:0,transAt:0,transStreak:0};
  return bp.words[wid];
}
function todayStr(offset=0){
  const d=new Date(); d.setDate(d.getDate()+offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(interval){
  const d=new Date(); d.setDate(d.getDate()+interval);
  d.setHours(3,0,0,0);
  return d.getTime();
}
function isDue(st){
  if(!st.reviewCount && !st.learnedAt) return false;
  return st.nextReview<=Date.now();
}
function applyRating(st, rate){
  const prev=st.interval||0;
  if(rate===1){
    st.streak=0; st.lapses++; st.interval=1; st.mastered=false;
  }else if(rate===2){
    st.streak=0; st.lapses++; st.interval=Math.max(1,Math.floor(prev*0.5)); st.mastered=false;
  }else if(rate===3){
    st.streak++; st.interval=GOOD_INT[Math.min(st.streak-1,GOOD_INT.length-1)];
  }else{
    st.streak++; st.interval=EASY_INT[Math.min(st.streak-1,EASY_INT.length-1)];
  }
  if(st.lapses>=3) st.interval=Math.max(1,Math.floor(st.interval*0.5));
  const cap=st.mastered?365:180;
  st.interval=Math.min(st.interval,cap);
  if(st.streak>=3 && st.interval>=21) st.mastered=true;
  else if(rate<=2) st.mastered=false;
  st.nextReview=addDays(st.interval);
  st.reviewCount=(st.reviewCount||0)+1;
  st.lastRate=rate;
  st.lastReview=Date.now();
  if(!st.learnedAt) st.learnedAt=Date.now();
}

/* ===================== Daily stats ===================== */
function getDaily(){
  if(!App.daily) App.daily=store.get('v14daily',{});
  return App.daily;
}
function saveDaily(){ store.set('v14daily', App.daily||{}); }
function logDaily(bookId, isNew){
  const d=getDaily();
  const k=todayStr();
  if(!d[k]) d[k]={new:0,review:0};
  if(isNew) d[k].new++; else d[k].review++;
  if(!d[k].byBook) d[k].byBook={};
  const bb=d[k].byBook;
  if(!bb[bookId]) bb[bookId]={new:0,review:0};
  if(isNew) bb[bookId].new++; else bb[bookId].review++;
  saveDaily();
  // streak
  const s=getSettings();
  s.streakLast=todayStr();
  if(s.streakCount===undefined) s.streakCount=0;
  const y=todayStr(-1);
  if(s.streakLastY!==k){ if(s.streakLastY===y) s.streakCount++; else s.streakCount=1; s.streakLastY=k; }
  saveSettings(s);
}
function dailyFor(bookIds, k){
  const d=getDaily();
  const rec=d[k];
  if(!rec) return {new:0,review:0};
  if(bookIds===null) return {new:rec.new||0,review:rec.review||0};
  const bb=rec.byBook||{};
  let n=0, r=0;
  bookIds.forEach(id=>{ const x=bb[id]; if(x){ n+=x.new||0; r+=x.review||0; } });
  return {new:n, review:r};
}

/* ===================== Audio ===================== */
let curAudio=null;
function playAudio(path){
  if(!path) return;
  try{ if(curAudio){curAudio.pause(); curAudio=null;} const a=new Audio(path); curAudio=a; a.play().catch(()=>{}); }catch(e){}
}
function playWordAudio(bookId, wid, accent){
  const d=cache[bookId]; if(!d||!d.vocab[wid]) return;
  const v=d.vocab[wid];

  if(pref==='all'){ playAudio(v.uk_audio); setTimeout(()=>playAudio(v.us_audio), 900); }
  else if(pref==='uk') playAudio(v.uk_audio);
  else playAudio(v.us_audio);
}
/* 音形等分时间切片：把整词发音按音素数均分时长，近似播放第 idx 个字母组 */
function playWordSlice(bookId, wid, accent, idx, total){
  const d=cache[bookId]; if(!d||!d.vocab[wid]) return;
  const v=d.vocab[wid];
  const pref=accent||getSettings().defaultAccent;
  const path=pref==='uk'? v.uk_audio : v.us_audio;
  if(!path||!total) return;
  try{
    if(curAudio){ curAudio.pause(); curAudio=null; }
    const a=new Audio(path); curAudio=a;
    const onMeta=()=>{
      const dur=(a.duration&&isFinite(a.duration))? a.duration : 3;
      const seg=dur/total;
      a.currentTime=Math.max(0, Math.min(idx*seg, Math.max(0,dur-seg*0.3)));
      a.play().catch(()=>{});
      clearTimeout(a._t);
      a._t=setTimeout(()=>{ try{a.pause();}catch(e){} }, Math.max(200, seg*1000-100));
    };
    if(a.readyState>=1) onMeta(); else a.addEventListener('loadedmetadata', onMeta, {once:true});
    a.load();
  }catch(e){}
}

/* ===================== 音形切分器（P0） ===================== */
const SND_DIGRAPHS = ['eigh','tch','dge','augh','ough','ight','tion','sion','ture','ai','ay','ea','ee','ei','ey','ie','oa','oe','oi','oy','oo','ou','ow','au','aw','eu','ew','ue','ui','ar','er','ir','or','ur','air','are','ear','eer','eir','our','oor','oar','ure','ere','ch','sh','th','ph','wh','ck','ng','qu','gh','dg','kn','wr','mb','ss','ff','ll','zz','pp','tt','dd','bb','gg','mm','nn','rr','cc'].sort((a,b)=>b.length-a.length);
const SND_PHON_DOUBLE = ['juː','uː','iː','ɑː','ɔː','ɜː','eː','oː','ɐː','tʃ','dʒ','aɪ','aʊ','eɪ','eə','ɪə','ʊə','ɔɪ','əʊ','oʊ','ju'].sort((a,b)=>b.length-a.length);
const SND_VOWELS = new Set(('aeiouəæʌɒɪʊɜɑɔe').split(''));
const SND_VOWEL_PH = new Set(['aɪ','aʊ','eɪ','eə','ɪə','ʊə','ɔɪ','əʊ','oʊ','ju']);
function stripIpa(ipa){
  let s=(ipa||'').replace(/\//g,' ');
  s=s.split(';')[0];
  s=s.replace(/[ˈˌ·]/g,'');
  s=s.replace(/[.,]/g,' ');
  s=s.replace(/\(r\)/g,'r').replace(/\(ə\)/g,'ə').replace(/\(n\)/g,'n').replace(/\(l\)/g,'l');
  s=s.replace(/[()]/g,'');
  s=s.replace(/\s+/g,'');
  return s.trim();
}
function splitGraphemes(word){
  let w=(word||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!w) return [];
  let n=w.length, me=-1;
  if(n>=3 && w[n-1]==='e' && 'bcdfghjklmnpqrstvwxz'.indexOf(w[n-2])>=0 && 'aeiou'.indexOf(w[n-3])>=0 && (n-3)>0){ me=n-3; w=w.slice(0,-1); n=w.length; }
  const out=[];
  let i=0;
  while(i<n){
    if(me!==-1 && i===me){ out.push(w[i]+'_e'); i++; continue; }
    let m=null;
    for(const L of [4,3,2]){ if(i+L<=n && SND_DIGRAPHS.indexOf(w.slice(i,i+L))>=0){ m=w.slice(i,i+L); break; } }
    if(m===null) m=w[i];
    out.push(m);
    i+=m.length;
  }
  return out;
}
function splitPhonemes(ipa){
  const s=stripIpa(ipa);
  const out=[];
  let i=0;
  while(i<s.length){
    let m=null;
    for(const L of [3,2]){ if(i+L<=s.length && SND_PHON_DOUBLE.indexOf(s.slice(i,i+L))>=0){ m=s.slice(i,i+L); break; } }
    if(m===null) m=s[i];
    out.push(m);
    i+=m.length;
  }
  return out;
}
function phType(ph){
  if(SND_VOWEL_PH.has(ph)) return 'vow';
  if(SND_VOWELS.has(ph[0])) return 'vow';
  return 'cons';
}
/* 校对表：册ID:词 → 手工切分（不改动 data/*.json，兜底不规则词） */
const SND_OVERRIDES = {
  '1000BEW1:clothes':{g:['cl','o_th','e_s'],p:['k','l','əʊ','ð','z']},
};
function soundSplit(bookId, word, ipa){
  const ov=SND_OVERRIDES[bookId+':'+(word||'').toLowerCase()];
  const g= ov? ov.g.slice() : splitGraphemes(word);
  const p= ov? ov.p.slice() : splitPhonemes(ipa);
  if(g.length===p.length){
    const pairs=[];
    for(let i=0;i<g.length;i++) pairs.push({g:g[i], p:p[i], type:phType(p[i]), locked:false});
    return {mode:'1:1', pairs, g, p};
  }
  return {mode:'fallback', pairs:null, g, p};
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}

/* ===================== 句子工具（P0） ===================== */
const STOPWORDS = new Set(('a an the of to in on at for with and or but is are was were be been being am do does did have has had not no so as it its this that these those from by about into than then when where which who whom what how why if will would can could may might must shall should there here your my his her our their its me him them us we they you i he she it').split(' '));
const CONTENT_MIN_LEN = 4;
function normalizeInput(s){
  return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function wordForms(w){
  w=(w||'').toLowerCase();
  if(w.length<2) return [w];
  const set=[w];
  if(w.endsWith('y') && 'bcdfghjklmnpqrstvwxz'.indexOf(w[w.length-2])>=0){
    const b=w.slice(0,-1);
    set.push(b+'ies', b+'ied', b+'ying', b+'ier', b+'iest');
  }else if(w.endsWith('e')){
    set.push(w+'s', w+'d', w.slice(0,-1)+'ing', w.slice(0,-1)+'er', w.slice(0,-1)+'est');
  }else{
    set.push(w+'s', w+'es', w+'ed', w+'ing', w+'er', w+'est');
  }
  return set;
}
function stemMatch(inputWord, target){
  const t=(target||'').toLowerCase();
  if(inputWord===t) return true;
  let w=inputWord;
  if(w.endsWith('ies')) w=w.slice(0,-3)+'y';
  else if(w.endsWith('ing')) w=w.slice(0,-3);
  else if(w.endsWith('ied')) w=w.slice(0,-3)+'y';
  else if(w.endsWith('ed')) w=w.slice(0,-2);
  else if(w.endsWith('es')) w=w.slice(0,-2);
  else if(w.endsWith('s')) w=w.slice(0,-1);
  else if(w.endsWith('d')) w=w.slice(0,-1);
  return w===t;
}
function hasTargetForm(input, target){
  return normalizeInput(input).split(' ').some(t=>stemMatch(t, target));
}
function contentWordsOf(sentence){
  return normalizeInput(sentence).split(' ').filter(t=>t.length>=CONTENT_MIN_LEN && !STOPWORDS.has(t));
}
function judgeTranslation(input, ref, target){
  const normIn=normalizeInput(input);
  if(!normIn) return {pass:false, reason:'empty', missing:[], hit:0, total:0};
  if(!hasTargetForm(normIn, target)) return {pass:false, reason:'target', missing:[]};
  const cw=contentWordsOf(ref);
  const inToks=normIn.split(' ');
  const threshold = App.transLevel===0? 0.5 : 0.6;
  if(cw.length===0) return {pass:true, reason:'ok', cov:1, hit:0, total:0, missing:[]};
  let hit=0;
  const missing=[];
  cw.forEach(c=>{ if(inToks.some(t=>t===c||stemMatch(t,c))) hit++; else missing.push(c); });
  const cov=hit/cw.length;
  return {pass:cov>=threshold, reason:cov>=threshold?'ok':'cover', cov, hit, total:cw.length, missing};
}
/* 在句子中查找目标词（含词形）的实际形式 */
function findWordForm(sentence, word){
  const forms=wordForms(word).sort((a,b)=>b.length-a.length);
  for(const f of forms){
    const re=new RegExp('(?<![A-Za-z])'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])','i');
    const m=sentence.match(re);
    if(m) return {form:f, match:m[0], index:m.index};
  }
  return null;
}
/* 句子目标词高亮：不区分大小写，优先最长词形 */
function highlightWord(sentence, word){
  const raw=(sentence||'').toString();
  if(!raw||!word) return esc(raw);
  const safe=esc(raw);
  const forms=wordForms(word).sort((a,b)=>b.length-a.length);
  for(const f of forms){
    const re=new RegExp('(?<![A-Za-z])'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])','gi');
    if(re.test(safe)) return safe.replace(re, m=>'<mark class="w-hl">'+m+'</mark>');
  }
  return safe;
}
/* F5 参考答案：目标词高亮 + 相邻实词下划线 */
function highlightRef(sentence, word){
  const raw=(sentence||'').toString();
  if(!raw) return '';
  const safe=esc(raw);
  const forms=wordForms(word).sort((a,b)=>b.length-a.length);
  let found=null;
  for(const f of forms){
    const re=new RegExp('(?<![A-Za-z])'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])','i');
    const m=re.exec(safe);
    if(m){ found={f, idx:m.index, len:m[0].length}; break; }
  }
  if(!found) return safe;
  let html=safe.slice(0,found.idx);
  html+='<mark class="w-hl">'+safe.slice(found.idx,found.idx+found.len)+'</mark>';
  const tail=safe.slice(found.idx+found.len);
  const toks=tail.split(/(\s+)/);
  const outTail=toks.map(seg=>{
    if(!seg.trim()) return seg;
    const w=seg.toLowerCase().replace(/[^a-z]/g,'');
    if(w.length>=CONTENT_MIN_LEN && !STOPWORDS.has(w)) return '<span class="wcp">'+seg+'</span>';
    return seg;
  }).join('');
  html+=outTail;
  return html;
}

/* 定位当前册中第一个未完成五流程的单元及其流程 */
function nextFlowStep(id){
  const data=cache[id]; if(!data) return null;
  for(const u of data.units){
    const fp=flowProgress(id, u.unit);
    if(fp.total===0) continue;
    const need=flowNeed(fp);
    for(const fl of FLOW_ORDER){ if(need[fl.st]<fp.total) return {unit:u.unit, stage:fl.st}; }
  }
  return null;
}

/* 一键继续：优先恢复上次学习位置（lastPos），否则定位下一未完成流程 */
function lastPosStep(id){
  const s=getSettings();
  const lp=s.lastPos;
  if(!lp || lp.bookId!==id || lp.unit==null) return null;
  const fp=flowProgress(id, lp.unit);
  const stage=lp.stage||0;
  const need=flowNeed(fp);
  if(need[stage]<fp.total) return {unit:lp.unit, stage};
  for(let i=stage+1;i<FLOW_ORDER.length;i++){ if(need[i]<fp.total) return {unit:lp.unit, stage:i}; }
  return null;
}
function continueStudy(id){
  const s=getSettings();
  const step=lastPosStep(id)||nextFlowStep(id);
  if(!step){ toast('本册已全部学完 🎉'); return; }
  App.flowUnit=step.unit;
  studyAt(id, step.unit, step.stage);
}
function renderFlowCard(){
  const card=$('flowCard'); if(!card) return;
  const id=getSettings().currentBookId;
  const data=cache[id];
  if(!data) return;
  const book=getBook(id);
  const nf=nextFlowStep(id);
  if(!nf){
    card.innerHTML='<div class="fc-empty" id="fcEmptyGo">当前册全部单元已学完 · 切换教材 →</div>';
    const go=$('fcEmptyGo'); if(go) go.onclick=()=>openDrawer();
    return;
  }
  const units=data.units.map(u=>u.unit);
  let sel=App.flowUnit||nf.unit;
  if(!units.includes(sel)) sel=nf.unit;
  const fp=flowProgress(id, sel);
  const total=fp.total;
  const stageMeta=FLOW_ORDER.map(fl=>fl.name);
  const counts=flowNeed(fp);
  let cur=-1;
  for(let i=0;i<FLOW_ORDER.length;i++){ if(counts[i]<total){ cur=i; break; } }
  let html='<div class="fc-head"><span class="fc-badge">学习流程</span>'+
    '<span class="fc-book">'+book.series+' · '+book.title+'</span>'+
    '<select id="fcUnitSel">'+units.map(u=>'<option value="'+u+'"'+(u===sel?' selected':'')+'>Unit '+u+'</option>').join('')+'</select></div>';
  html+='<div class="fc-steps">';
  for(let i=0;i<FLOW_ORDER.length;i++){
    const done=total>0 && counts[i]>=total;
    const pct=total?Math.round(counts[i]/total*100):0;
    html+='<div class="fc-step'+(done?' done':'')+(i===cur?' cur':'')+'" data-stage="'+i+'">'+
      '<div class="fc-name">'+(done?'✓ ':'')+stageMeta[i]+'</div>'+
      '<div class="fc-num">'+counts[i]+' / '+total+'</div>'+
      '<span class="fc-bar"><b style="width:'+pct+'%"></b></span></div>';
    if(i<FLOW_ORDER.length-1) html+='<span class="fc-arrow">→</span>';
  }
  html+='</div><div class="fc-foot">'+
    '<button class="btn tint" id="fcFlowBtn">▶ 连续学本单元</button>'+
    '<button class="btn tint" id="fcAllBtn">▶ 连续学本册</button></div>';
  card.innerHTML=html;
  const selEl=$('fcUnitSel');
  if(selEl) selEl.onchange=()=>{ App.flowUnit=parseInt(selEl.value,10); renderFlowCard(); };
  const flowBtn=$('fcFlowBtn'); if(flowBtn) flowBtn.onclick=()=>startStudy({bookId:id, mode:'flow', unit:sel});
  const allBtn=$('fcAllBtn'); if(allBtn) allBtn.onclick=()=>startStudy({bookId:id, mode:'bookFlow'});
  card.querySelectorAll('.fc-step').forEach(el=>{
    el.onclick=()=>{
      App.flowUnit=sel;
      studyAt(id, sel, parseInt(el.dataset.stage,10));
    };
  });
}

/* ===================== Unit learning flow ===================== */
/* 5 流程：F1 音形 → F2 词卡 → F3 听写 → F4 句中填空 → F5 句子翻译（步骤 预习/复习/巩固） */
const FLOW_ORDER=[
  {st:0, key:'sound', mode:'sound', name:'音形对应', short:'音形', step:1},
  {st:1, key:'card',  mode:'unit',  name:'词卡',     short:'词卡', step:1},
  {st:2, key:'dict',  mode:'spell', name:'听写',     short:'听写', step:2},
  {st:3, key:'blank', mode:'blank', name:'句中填空', short:'填空', step:3},
  {st:4, key:'trans', mode:'trans', name:'句子翻译', short:'翻译', step:3},
];
function stageDone(bookId, wid, stage){
  const st=getWordState(bookId, wid);
  if(stage===0) return !!st.soundAt;
  if(stage===1) return !!st.learnedAt;
  if(stage===2) return !!(st.dictatedAt||st.spelledAt);
  if(stage===3) return !!st.blankAt;
  return !!st.transAt;
}
function flowProgress(id, unit){
  const data=cache[id]; if(!data) return {total:0,sound:0,card:0,dict:0,blank:0,trans:0};
  const bp=getBookProg(id);
  const words=unit? data.vocab.filter(v=>v.unit===unit) : data.vocab;
  let sound=0, card=0, dict=0, blank=0, trans=0;
  words.forEach(v=>{
    const st=bp.words[v.id]||{};
    if(st.soundAt) sound++;
    if(st.learnedAt) card++;
    if(st.dictatedAt||st.spelledAt) dict++;
    if(st.blankAt) blank++;
    if(st.transAt) trans++;
  });
  return {total:words.length, sound, card, dict, blank, trans};
}
function flowNeed(fp){ return [fp.sound, fp.card, fp.dict, fp.blank, fp.trans]; }
function stageQueue(bookId, unit, stage){
  const data=cache[bookId]; if(!data) return [];
  return data.vocab.filter(v=>v.unit===unit && !stageDone(bookId, v.id, stage)).map(v=>({vid:v.id, unit:v.unit}));
}

/* ===================== Study Engine ===================== */
let AudioEl=null;
function studyAt(bookId, unit, stage){
  const fl=FLOW_ORDER[stage]; if(!fl) return;
  const s=getSettings();
  if(fl.mode==='unit'){ App.bookMode='unit'; App.spellOn=false; startStudy({bookId, mode:'unit', unit}); }
  else if(fl.mode==='spell'){ App.bookMode='spell'; App.spellOn=true; s.spellHideCn=true; saveSettings(); startStudy({bookId, mode:'spell', unit}); }
  else { startStudy({bookId, mode:fl.mode, unit}); }
}
function startStudy(opts){
  const s=getSettings();
  const bookId=opts.bookId||s.currentBookId;
  const data=cache[bookId];
  if(!data){ loadBook(bookId).then(()=>startStudy(opts)); return; }
  const mode=opts.mode||'unit';
  // 连续学：flow(单单元 音形→词卡→听写→填空→翻译) / bookFlow(整册所有未完成流程)
  if(mode==='flow'||mode==='bookFlow'){
    const build= mode==='flow'
      ? FLOW_ORDER.map(fl=>({bookId, unit:opts.unit, stage:fl.st}))
      : (()=>{ const ch=[]; data.units.forEach(u=>{ const fp=flowProgress(bookId,u.unit); const need=flowNeed(fp); FLOW_ORDER.forEach(fl=>{ if(need[fl.st]<fp.total) ch.push({bookId,unit:u.unit,stage:fl.st}); }); }); return ch; })();
    const chain=build.filter(seg=>{
      const fp=flowProgress(seg.bookId,seg.unit);
      return flowNeed(fp)[seg.stage]<fp.total;
    });
    if(chain.length===0){ toast((mode==='flow'?'本单元':'本册')+'已全部学完 🎉'); return; }
    const seg=chain[0];
    const fl0=FLOW_ORDER[seg.stage];
    if(fl0.mode==='unit'){ App.bookMode='unit'; App.spellOn=false; }
    else if(fl0.mode==='spell'){ App.bookMode='spell'; App.spellOn=true; s.spellHideCn=true; saveSettings(); }
    return startStudy({bookId:seg.bookId, mode:fl0.mode, unit:seg.unit, chain, chainIdx:0});
  }
  let queue=[];
  let unitLabel='';
  const FLOW_LABEL={sound:'音形对应', spell:'听写', blank:'句中填空', trans:'句子翻译'};
  if(mode==='unit'){
    const unit=opts.unit;
    unitLabel='Unit '+unit;
    queue=data.vocab.filter(v=>v.unit===unit && !getWordState(bookId,v.id).mastered)
      .map(v=>({vid:v.id, unit:v.unit}));
  }else if(mode==='spell'){
    const unit=opts.unit;
    unitLabel='听写 · Unit '+unit;
    queue=stageQueue(bookId, opts.unit, 2);
  }else if(mode==='sound'){
    const unit=opts.unit;
    unitLabel='音形对应 · Unit '+unit;
    queue=stageQueue(bookId, opts.unit, 0);
  }else if(mode==='blank'){
    const unit=opts.unit;
    unitLabel='句中填空 · Unit '+unit;
    queue=stageQueue(bookId, opts.unit, 3);
  }else if(mode==='trans'){
    const unit=opts.unit;
    unitLabel='句子翻译 · Unit '+unit;
    queue=stageQueue(bookId, opts.unit, 4);
  }else if(mode==='hard'){
    unitLabel='难词攻克';
    const hw=hardWords();
    const missing=hw.filter(h=>!cache[h.bookId]);
    if(missing.length){
      Promise.all(missing.map(h=>loadBook(h.bookId))).then(()=>{
        startStudy({bookId:opts.bookId||s.currentBookId, mode:'hard'});
      });
      return;
    }
    queue=hw.map(h=>({vid:h.vid, unit:cache[h.bookId].vocab[h.vid].unit, bookId:h.bookId}));
  }else{ // due (all series due)
    queue=allDueQueue().map(x=>({vid:x.wid, unit:(cache[x.bookId]?cache[x.bookId].vocab[x.wid].unit:0), bookId:x.bookId}));
    unitLabel='到期复习 ('+queue.length+')';
  }
  if(queue.length===0){
    toast('没有可学习的词了 🎉');
    return;
  }
  if(mode==='unit'||mode==='spell'||mode==='sound'||mode==='blank'||mode==='trans'){
    // 同步当前册，保证 hero/流程卡与所学内容一致
    s.currentBookId=bookId; s.currentSeries=getBook(bookId).series;
    App.currentBookId=bookId; App.currentSeries=s.currentSeries;
    const stgMap={sound:0,unit:1,spell:2,blank:3,trans:4};
    s.lastPos={bookId, unit:opts.unit||null, stage:stgMap[mode]};
    saveSettings();
  }
  App.study={bookId, mode, unit:opts.unit||null, queue, idx:0, done:{}, wrong:[], total:queue.length, chain:opts.chain||null, chainIdx:opts.chainIdx||0};
  $('completeBox').classList.remove('show');
  $('study').classList.add('open');
  $('studyTtl').textContent=getBook(bookId).series+' · '+(unitLabel||getBook(bookId).title);
  $('studySub').textContent='1 / '+queue.length;
  renderStudyWl();
  renderStudyCard();
  renderStudyStages();
  $('studyWl').classList.remove('open'); syncWlBtn();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ try{$('studyCard').scrollIntoView({block:'nearest'});}catch(e){} }));
}

function rate(r){

function jumpTo(i){
