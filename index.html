function prevWord(){ if(App.study.mode!=='unit') return; if(App.study.idx>0){ App.study.idx--; renderStudyWl(); renderStudyCard(); } }
function nextWord(){ if(App.study.mode!=='unit') return; if(App.study.idx<App.study.queue.length-1){ App.study.idx++; renderStudyWl(); renderStudyCard(); } }
/* spell check */
function normSpell(s){
  return (s||'').toLowerCase()
    .replace(/\([^)]*\)/g,'')
    .replace(/[.\u2026\u00b7]+$/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function blankWordInSentence(s, word){
  if(!s||!word) return '';
  const re=new RegExp('\\b'+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
  return s.replace(re,'______');
}
function renderSlots(pat, buf){
  const el=$('sBox'); if(!el) return;
  const locked=!!(App.study&&App.study.lock);
  let html=''; let caretPlaced=false;
  for(let i=0;i<pat.length;i++){
    const c=pat[i];
    if(c===' '){ html+='<i class="space"></i>'; continue; }
    if(!/[a-z]/.test(c)){ html+='<i class="lit">'+esc(c)+'</i>'; continue; }
    const t=buf&&buf[i]?buf[i]:'';
    if(!locked&&!caretPlaced&&!t){ html+='<i class="caret"></i>'; caretPlaced=true; }
    html+='<i'+(t?' class="filled"':'')+'>'+esc(t)+'</i>';
  }
  if(!locked&&!caretPlaced) html+='<i class="caret"></i>';
  el.innerHTML=html;
}
function typeLetter(ch){
  const st=App.study;
  if(!st||st.mode!=='spell'||st.lock) return;
  const pat=st.spellPat, buf=st.spellBuf;
  if(!pat||!buf) return;
  for(let i=0;i<pat.length;i++){
    if(/[a-z]/.test(pat[i]) && !buf[i]){
      buf[i]=ch; renderSlots(pat,buf);
      $('sHint').textContent=getSettings().spellHideCn?'听写模式 · 听音拼写，点击下划线输入':'拼写模式 · 点击下划线直接输入';
      return;
    }
  }
}
function backspaceTyped(){
  const st=App.study;
  if(!st||st.mode!=='spell'||st.lock) return;
  const pat=st.spellPat, buf=st.spellBuf;
  if(!pat||!buf) return;
  for(let i=pat.length-1;i>=0;i--){
    if(/[a-z]/.test(pat[i]) && buf[i]){ buf[i]=''; renderSlots(pat,buf); return; }
  }
}
function fillSlotsGood(pat){
  const el=$('sBox'); if(!el) return;
  let html='';
  for(let i=0;i<pat.length;i++){
    const c=pat[i];
    if(c===' ') html+='<i class="space"></i>';
    else if(!/[a-z]/.test(c)) html+='<i class="lit">'+esc(c)+'</i>';
    else html+='<i class="good">'+esc(c)+'</i>';
  }
  el.innerHTML=html;
}
function checkSpell(){
  const st=App.study;
  if(st.mode!=='spell'||st.lock) return;
  st.lock=true;
  const item=st.queue[st.idx];
  const v=cache[item.bookId||st.bookId].vocab[item.vid];
  const pat=st.spellPat||normSpell(v.word);
  const buf=st.spellBuf||new Array(pat.length).fill('');
  let typed='';
  for(let i=0;i<pat.length;i++) if(/[a-z]/.test(pat[i])) typed+=buf[i]||'';
  const ans=pat.replace(/[^a-z]/g,'');
  const ws=getWordState(item.bookId||st.bookId,item.vid);
  const isNew=!ws.learnedAt;
  if(typed.length<ans.length){
    $('sHint').textContent='还差 '+(ans.length-typed.length)+' 个字母，继续输入';
    st.lock=false;
    $('sInput').focus({preventScroll:true});
    return;
  }
  const ok=typed===ans;
  if(ok){
    fillSlotsGood(pat);
    ws.spellStreak=(ws.spellStreak||0)+1;
    if(getSettings().spellHideCn) ws.dictatedAt=Date.now(); else ws.spelledAt=Date.now();
    applyRating(ws, ws.spellStreak>=2? 4 : 3);
    if(isNew) logDaily(item.bookId||st.bookId,true); else logDaily(st.bookId,false);
    st.done[item.vid]=true;
    saveProgress();
    setTimeout(advance,500);
  }else{
    ws.spellStreak=0;
    renderSlots(pat,buf);
    let html='';
    for(let i=0;i<pat.length;i++){
      const c=pat[i];
      if(c===' '||!/[a-z]/.test(c)){ html+='<i></i>'; continue; }
      html+= (buf[i]||'')===c ? '<b class="ok">'+esc(c)+'</b>' : '<b class="miss">'+esc(c)+'</b>';
    }
    const feed=$('sFeed'); feed.innerHTML=html; feed.classList.add('show');
    $('sAns').textContent='正确答案：'+v.word;
    $('sAns').classList.add('show');
    playWordAudio(item.bookId||st.bookId,item.vid,'us');
    applyRating(ws,1);
    if(isNew) logDaily(item.bookId||st.bookId,true); else logDaily(st.bookId,false);
    st.wrong.push(item.vid);
    st.done[item.vid]=true;
    saveProgress();
    setTimeout(()=>{ $('sAns').className='s-ans'; $('sFeed').innerHTML=''; $('sFeed').classList.remove('show'); advance(); },1200);
  }
}
/* ===== F1 音形对应引擎 ===== */
let sndPairs=null, sndTarget=-1;
function renderSound(){
  const st=App.study;
  const item=st.queue[st.idx];
  const v=cache[item.bookId||st.bookId].vocab[item.vid];
  const ipa=v.uk_pron||v.us_pron||'';
  const ss=soundSplit(item.bookId||st.bookId, v.word, ipa);
  sndPairs=ss.pairs; sndTarget=-1;
  $('sndWord').textContent=v.word+'  /'+ipa+'/';
  const rows=$('sndRows'); rows.innerHTML='';
  const check=$('sndCheck');
  if(ss.mode==='1:1'&&ss.pairs&&ss.pairs.length>1){
    check.style.display='none';
    const grow=document.createElement('div'); grow.className='snd-grow';
    ss.pairs.forEach((pair,i)=>{
      const d=document.createElement('div'); d.className='snd-g'; d.dataset.i=i;
      d.innerHTML='<div class="g-letters">'+esc(pair.g.replace(/_e$/,''))+'</div>'+
        '<div class="g-meta">'+(pair.type==='vow'?'元音':'辅音')+'</div><div class="g-phons"></div>';
      d.onclick=()=>{ if(sndPairs[i].locked) return; sndTarget=i; renderSndSel(); playWordAudio(st.bookId,item.vid,'us'); };
      grow.appendChild(d);
    });
    rows.appendChild(grow);
  }else{
    // fallback：切分不等长 → 展示整词 + 音素，点“继续”完成
    check.style.display='';
    rows.innerHTML='<div class="snd-hint">该词切分特殊，听发音熟悉字母组即可</div>';
    const grow=document.createElement('div'); grow.className='snd-grow';
    const d=document.createElement('div'); d.className='snd-g';
    d.innerHTML='<div class="g-letters">'+esc(v.word)+'</div><div class="g-meta">整体</div><div class="g-phons"></div>';
    grow.appendChild(d);
    rows.appendChild(grow);
  }
  const tray=$('sndTray'); tray.innerHTML='';
  const ps=ss.p&&ss.p.length? ss.p.slice() : splitPhonemes(ipa);
  shuffle(ps).forEach(ph=>{
    const b=document.createElement('button');
    b.className='snd-p '+phType(ph);
    b.textContent=ph;
    b.onclick=()=>matchSnd(ph);
    tray.appendChild(b);
  });
  $('sndFeed').textContent=''; $('sndFeed').className='snd-feed';
  $('sndHint').textContent=ss.mode==='1:1'?'点字母组选中（自动发音）→ 再从下方选对应音素':'听发音，熟悉后点「继续」';
  setTimeout(()=>playWordAudio(st.bookId,item.vid,'us'),150);
}
function renderSndSel(){
  if(!sndPairs) return;
  document.querySelectorAll('#sndRows .snd-g').forEach(el=>{
    const i=parseInt(el.dataset.i,10);
    if(isNaN(i)) return;
    el.classList.toggle('target', i===sndTarget && !sndPairs[i].locked);
    el.classList.toggle('done', sndPairs[i].locked);
  });
}
function matchSnd(ph){
  const st=App.study; if(!st||st.mode!=='sound'||!sndPairs) return;
  const item=st.queue[st.idx];
  if(sndTarget<0){ $('sndFeed').className='snd-feed no'; $('sndFeed').textContent='先点击一个字母组（会播放整词发音）'; return; }
  const pair=sndPairs[sndTarget];
  if(pair.locked) return;
  if(ph===pair.p){
    pair.locked=true;
    const el=document.querySelector('#sndRows .snd-g[data-i="'+sndTarget+'"]');
    if(el){
      el.classList.add('done');
      el.querySelector('.g-phons').innerHTML='<span class="g-ph '+pair.type+'">'+esc(pair.p)+'</span>';
    }
    for(const b of [...$('sndTray').children]){ if(b.textContent===ph){ b.remove(); break; } }
    $('sndFeed').className='snd-feed ok'; $('sndFeed').textContent='正确 ✓';
    sndTarget=-1;
    if(sndPairs.every(p=>p.locked)){
      const item=st.queue[st.idx];
      const ws=getWordState(item.bookId||st.bookId,item.vid);
      ws.soundAt=Date.now();
      saveProgress();
      st.done[item.vid]=true;
      setTimeout(()=>{ $('sndFeed').textContent=''; $('sndFeed').className='snd-feed'; advance(); },450);
    }else{
      const next=sndPairs.findIndex(p=>!p.locked);
      if(next>=0){ sndTarget=next; renderSndSel(); playWordAudio(st.bookId,item.vid,'us'); }
      else setTimeout(()=>{ $('sndFeed').textContent=''; $('sndFeed').className='snd-feed'; },600);
    }
  }else{
    const el=document.querySelector('#sndRows .snd-g[data-i="'+sndTarget+'"]');
    if(el){ el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong'); }
    $('sndFeed').className='snd-feed no';
    $('sndFeed').textContent='不对，再听一遍发音';
  }
}

function blankSentence(sent, pat){
  if(!sent||!pat) return '<span style="color:var(--ink3)">（本词暂无例句）</span>';
  const re=new RegExp('\\b'+pat.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
  return sent.replace(re, m=>'<mark class="blank">______</mark>');
}
function checkBlank(){
  const st=App.study; if(!st||st.mode!=='blank'||st.lock) return;
  st.lock=true;
  const inp=$('blkInput');
  const val=inp.value.trim();
  const item=st.queue[st.idx];
  const v=cache[item.bookId||st.bookId].vocab[item.vid];
  const target=st.blkPat||normSpell(v.word);
  if(!val){ $('blkFeed').className='blk-feed no'; $('blkFeed').textContent='请输入单词'; st.lock=false; inp.focus({preventScroll:true}); return; }
  if(hasTargetForm(val, target)){
    $('blkSent').innerHTML=highlightWord(v.example||'', target).replace('class="w-hl"','class="w-hl ok"');
    $('blkFeed').className='blk-feed ok'; $('blkFeed').textContent='正确 ✓';
    const ws=getWordState(item.bookId||st.bookId,item.vid);
    ws.blankAt=Date.now();
    saveProgress();
    st.done[item.vid]=true;
    setTimeout(advance,500);
  }else{
    inp.classList.add('err');
    $('blkFeed').className='blk-feed no'; $('blkFeed').textContent='不对，正确答案：'+v.word;

  }
}

function transRefHtml(v, target){
  const ref=v.example||v.definition||'';
  return '<div class="r-lbl">参考答案</div>'+highlightRef(ref, target);
}
function checkTrans(){
  const st=App.study; if(!st||st.mode!=='trans'||st.lock) return;
  st.lock=true;
  const item=st.queue[st.idx];
  const v=cache[item.bookId||st.bookId].vocab[item.vid];
  const target=st.trWord||normSpell(v.word);
  const ref=v.example||v.definition||'';
  const res=judgeTranslation($('trInput').value, ref, target);
  if(res.pass){
    $('trFeed').className='tr-feed ok'; $('trFeed').textContent='翻译正确 ✓';
    const ws=getWordState(item.bookId||st.bookId,item.vid);
    ws.transAt=Date.now();
    ws.transStreak=(ws.transStreak||0)+1;
    saveProgress();
    st.done[item.vid]=true;
    setTimeout(advance,500);
  }else{
    const refEl=$('trRef');
    let extra='';
    if(res.reason==='target') extra='<div class="r-miss">需要包含目标词 '+esc(v.word)+'</div>';
    else if(res.missing&&res.missing.length) extra='<div class="r-miss">遗漏关键词：'+res.missing.map(esc).join('、')+'</div>';
    refEl.innerHTML=transRefHtml(v,target)+extra;
    refEl.classList.add('show');
    $('trFeed').className='tr-feed no';
    $('trFeed').textContent=res.reason==='empty'?'请输入英文句子':'再试一次，或看参考答案';
    st.lock=false;
    $('trInput').focus({preventScroll:true});
  }
}
function skipTrans(){
  const st=App.study; if(!st||st.mode!=='trans'||st.lock) return;
  st.lock=true;
  const item=st.queue[st.idx];
  const v=cache[item.bookId||st.bookId].vocab[item.vid];
  const target=st.trWord||normSpell(v.word);
  const refEl=$('trRef');
  refEl.innerHTML=transRefHtml(v,target);
  refEl.classList.add('show');
  st.done[item.vid]=true;
  setTimeout(advance,1100);
}
function showComplete(){
  const st=App.study;
  // 连续学：单阶段完成后自动衔接下一流程（音形→词卡→听写→填空→翻译）
  if(st.chain && st.chainIdx < st.chain.length-1){

/* ===================== Stats ===================== */
function hardWords(){
  const p=getProgress();
  const hard=[];
  BOOKS.forEach(b=>{
    const bp=p[b.id]; if(!bp) return;
    for(const k in bp.words){
      const st=bp.words[k];
      if(st.lapses>=2 || (st.lastRate<=2 && st.reviewCount>=3)){
        hard.push({bookId:b.id, vid:Number(k), st});
      }
    }
  });
  return hard.sort((a,b)=>b.st.lapses-a.st.lapses || b.st.reviewCount-a.st.reviewCount).slice(0,50);
}
function renderStats(){
  const scope=App.statsScope||'book';
  document.querySelectorAll('#statsSeg b').forEach(b=>b.classList.toggle('on', b.dataset.scope===scope));
  const sb=$('statBook'), sg=$('statGlobal');
  sb.style.display=scope==='book'?'':'none';
  sg.style.display=scope==='global'?'':'none';
  // 难词攻克（两个模块共用）
  const hard=hardWords();
  const hc=$('hardCount'); if(hc) hc.textContent=hard.length? hard.length+' 词':'';
  const hb=$('hardReview'); if(hb){
    hb.onclick=()=>{ if(!hard.length){ toast('暂无难词 🎉'); return; } startStudy({mode:'hard'}); };
    hb.disabled=!hard.length;
    hb.style.opacity=hard.length?'' : .55;
  }
  if(scope==='book') renderStatBook();
  else renderStatGlobal();
}
function renderStatGlobal(){
  const s=getSettings();
  let learned=0, mastered=0, due=0;
  BOOKS.forEach(b=>{ const bp=getBookProg(b.id);
    for(const k in bp.words){ const st=bp.words[k]; if(st.reviewCount) learned++; if(st.mastered) mastered++; if(isDue(st)) due++; } });
  const kpi=$('kpis');
  kpi.innerHTML=
    '<div class="kpi"><div class="k-t">累计学习</div><div class="k-v">'+learned.toLocaleString()+'</div><div class="k-s">词 · 全部系列</div></div>'+
    '<div class="kpi"><div class="k-t">已掌握</div><div class="k-v" style="color:#34C759">'+mastered.toLocaleString()+'</div><div class="k-s">'+(learned?Math.round(mastered/learned*100):0)+'% 通过率</div></div>'+
    '<div class="kpi"><div class="k-t">待复习</div><div class="k-v" style="color:#FF9500">'+due.toLocaleString()+'</div><div class="k-s">今日到期 '+allDueQueue().length+'</div></div>'+
    '<div class="kpi"><div class="k-t">连续学习</div><div class="k-v">'+(s.streakCount||0)+'</div><div class="k-s">天 · 保持节奏</div></div>';
  // line
  const d=getDaily();
  const days=App.statDays===7?[...Array(7)].map((_,i)=>todayStr(i-6)):[...Array(30)].map((_,i)=>todayStr(i-29));
  const line=$('statLine'); line.innerHTML='';
  const maxV=Math.max(1,...days.map(k=>(d[k]?d[k].new+d[k].review:0)));
  days.forEach(k=>{
    const rec=d[k]||{new:0,review:0};
    const col=document.createElement('div'); col.className='col';
    col.innerHTML='<i style="height:'+Math.round(rec.new/maxV*100)+'%"><span class="tip">'+k.slice(5)+' 新 '+rec.new+'</span></i>'+
      (rec.review?'<i class="r" style="height:'+Math.round(rec.review/maxV*100)+'%"><span class="tip">'+k.slice(5)+' 复 '+rec.review+'</span></i>':'');
    line.appendChild(col);
  });
  document.querySelectorAll('#statSeg b').forEach(b=>b.classList.toggle('on', Number(b.dataset.days)===App.statDays));
  // dist
  const dist=$('distBox'); dist.innerHTML='';
  const buckets=[{k:'不会',r:'#FF3B30'},{k:'困难',r:'#FF9500'},{k:'一般',r:'#5856D6'},{k:'简单',r:'#34C759'}];
  const counts=[0,0,0,0];
  BOOKS.forEach(b=>{ const bp=getBookProg(b.id);
    for(const k in bp.words){ const st=bp.words[k]; if(st.lastRate>=1&&st.lastRate<=4) counts[st.lastRate-1]++; } });
  const total=counts.reduce((a,b)=>a+b,0);
  buckets.forEach((bk,i)=>{
    const n=counts[i], pct=total? n/total*100:0;
    dist.innerHTML+='<div class="dist-row"><span class="d-l">'+bk.k+'</span><div class="prog"><i style="width:'+pct+'%;background:'+bk.r+'"></i></div><span class="d-v">'+Math.round(pct)+'%</span></div>';
  });
  // series compare
  const sc=$('scompBox'); sc.innerHTML='';
  SERIES_ORDER.forEach(series=>{
    const st=seriesStat(series);
    const pct=st.total? st.learned/st.total*100:0;
    sc.innerHTML+='<div class="scomp-row"><span class="sn" style="color:'+SERIES_COLOR[series]+'">'+series+'</span><div class="prog"><i style="width:'+pct+'%;background:'+SERIES_COLOR[series]+'"></i></div><span class="sv">'+st.learned.toLocaleString()+' / '+st.total.toLocaleString()+'</span></div>';
  });
  if(learned===0) kpi.innerHTML='<div class="empty" style="grid-column:1/-1;padding:30px">还没有学习数据 · 学一组词查看统计吧</div>';
}
function renderStatBook(){
  const s=getSettings();
  const series=App.statSeries||App.libSeries||s.currentSeries||'词汇2000';
  const books=BOOKS.filter(b=>b.series===series&&b.available);
  if(!books.length) return;
  let bookId=App.statBookId;
  if(!bookId || !books.some(b=>b.id===bookId)) bookId=books[0].id;
  App.statSeries=series; App.statBookId=bookId;
  // 系列 + 分册 两级选择器
  const ss=$('sbSeries');
  ss.innerHTML=SERIES_ORDER.map(x=>'<option value="'+x+'"'+(x===series?' selected':'')+'>'+x+'</option>').join('');
  const bs=$('sbBook');
  bs.innerHTML=books.map(b=>'<option value="'+b.id+'"'+(b.id===bookId?' selected':'')+'>'+b.title+'</option>').join('');
  const book=getBook(bookId);
  const bp=getBookProg(bookId);
  let learnedB=0, masteredB=0, dueB=0;
  for(const k in bp.words){ const w=bp.words[k]; if(w.reviewCount) learnedB++; if(w.mastered) masteredB++; if(isDue(w)) dueB++; }
  const data=cache[bookId];
  let unitsDone=0, unitsTotal=(data?data.units.length:book.units);
  (data?data.units:[]).forEach(u=>{ const fp=flowProgress(bookId,u.unit); const need=flowNeed(fp); if(fp.total&&need.every(n=>n>=fp.total)) unitsDone++; });
  const kpi=$('sbKpis');
  kpi.innerHTML=
    '<div class="kpi"><div class="k-t">累计学习</div><div class="k-v">'+learnedB.toLocaleString()+'</div><div class="k-s">'+book.series+' · '+book.title+'</div></div>'+
    '<div class="kpi"><div class="k-t">已掌握</div><div class="k-v" style="color:#34C759">'+masteredB.toLocaleString()+'</div><div class="k-s">'+(learnedB?Math.round(masteredB/learnedB*100):0)+'% 通过率</div></div>'+
    '<div class="kpi"><div class="k-t">待复习</div><div class="k-v" style="color:#FF9500">'+dueB.toLocaleString()+'</div><div class="k-s">本册今日到期</div></div>'+
    '<div class="kpi"><div class="k-t">单元完成</div><div class="k-v">'+unitsDone+'</div><div class="k-s">/ '+unitsTotal+' 单元</div></div>';
  // 本教材学习量（byBook 维度）
  const d=getDaily();
  const days=App.statDaysBook===30?[...Array(30)].map((_,i)=>todayStr(i-29)):[...Array(7)].map((_,i)=>todayStr(i-6));
  const maxV=Math.max(1,...days.map(k=>{ const r=dailyFor([bookId],k); return r.new+r.review; }));
  const bars=$('sbBars'); bars.innerHTML='';
  const labels=['日','一','二','三','四','五','六'];
  days.forEach(k=>{
    const rec=dailyFor([bookId],k);
    const hN=Math.round(rec.new/maxV*100), hR=Math.round(rec.review/maxV*100);
    const day=new Date(k+'T00:00:00').getDay();
    const bar=document.createElement('div'); bar.className='bar';
    bar.innerHTML='<span class="tip">'+k.slice(5)+' · 新 '+rec.new+' / 复 '+rec.review+'</span>'+
      (rec.new?'<i style="height:'+hN+'%"></i>':'')+
      (rec.review?'<i class="rev" style="height:'+hR+'%"></i>':'')+
      '<div class="bar-label">'+labels[day]+'</div>';
    bars.appendChild(bar);
  });
  document.querySelectorAll('#sbSeg b').forEach(b=>b.classList.toggle('on', Number(b.dataset.days)===(App.statDaysBook||7)));
  // 单元进度
  const ul=$('sbUnits'); ul.innerHTML='';
  (data?data.units:[]).forEach(u=>{
    const fp=flowProgress(bookId,u.unit);
    const need=flowNeed(fp);
    const done=!!fp.total&&need.every(n=>n>=fp.total);
    const p3=fp.total?Math.round(need.reduce((a,b)=>a+b,0)/(fp.total*FLOW_ORDER.length)*100):0;
    const div=document.createElement('div'); div.className='unit'+(done?' done':'');
    div.style.cursor='default';
    div.innerHTML='<div class="u-no">'+u.unit+'</div>'+
      '<div class="u-info"><div class="u-name">Unit '+u.unit+(done?' <span class="tag done">已学完</span>':'')+'</div>'+
      '<div class="u-sub"><span>音形 '+fp.sound+'/'+fp.total+'</span><span>词卡 '+fp.card+'/'+fp.total+'</span><span>听写 '+fp.dict+'/'+fp.total+'</span><span>填空 '+fp.blank+'/'+fp.total+'</span><span>翻译 '+fp.trans+'/'+fp.total+'</span></div></div>'+
      '<div class="u-prog" style="width:70px"><i style="width:'+p3+'%"></i></div>';
    ul.appendChild(div);
  });
  if(!ul.children.length) ul.innerHTML='<div class="empty">该册暂无单元数据</div>';
}

function bookIdOfSeries(series){ const b=BOOKS.find(b=>b.series===series&&b.available); return b?b.id:'2000CEW1'; }
function notifState(){
  if(!('Notification' in window)) return {cls:'off', txt:'不支持'};
  if(Notification.permission==='granted') return {cls:'on', txt:'已开启'};
  if(Notification.permission==='denied') return {cls:'off', txt:'已拒绝'};
  return {cls:'off', txt:'未开启'};
}
function notifStateHTML(){
  const st=notifState();
  return '<span class="pill stat '+st.cls+'">'+st.txt+'</span>';
}
function requestNotifPermission(silent){
  if(!('Notification' in window)){ toast('当前浏览器不支持系统通知'); return; }
  if(Notification.permission==='granted'){ if(!silent) toast('系统通知已开启'); return; }
  if(Notification.permission==='denied'){ toast('通知权限已被拒绝，请在浏览器设置中允许'); return; }
  try{
    const p=Notification.requestPermission();
    Promise.resolve(p).then(perm=>{
      if(perm==='granted') toast('系统通知已开启 ✓');
      else toast('未授予通知权限，可稍后在浏览器设置中开启');
      renderSettings();
    });
  }catch(e){ toast('无法请求通知权限'); }
}
function exportUnlearned(){
  // 全局导出：全部系列未掌握词（含系列/教材列）
  const need=BOOKS.filter(b=>b.available&&!cache[b.id]);
  if(need.length){ Promise.all(need.map(b=>loadBook(b.id))).then(()=>exportUnlearned()); return; }
  const p=getProgress();
  const escCsv=cell=>{
    const c=String(cell==null?'':cell);
    return /[",\n]/.test(c)? '"'+c.replace(/"/g,'""')+'"' : c;
  };
  const rows=[];
  let total=0;
  BOOKS.forEach(b=>{
    if(!b.available) return;
    const data=cache[b.id]; if(!data) return;
    const bp=p[b.id];
    data.vocab.forEach(v=>{
      const st=bp?bp.words[v.id]:null;
      // 仅导出「已学过但未掌握」的词；从未触碰过的词不导出（否则等于导出整本词书）
      if(!st || st.mastered) return;
      total++;
      rows.push([b.series, b.title, v.word, v.uk_pron||'', v.us_pron||'', v.cn_meaning||''].map(escCsv).join(','));
    });
  });
  const blob=new Blob(['\ufeff系列,教材,英文,音标(英),音标(美),中文释义\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='词书架-未掌握词表-全部系列.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('已导出未掌握词 '+total+' 词');
}
function backupAllData(){
  const data={app:'词书架', ver:1, ts:Date.now(), progress:getProgress(), daily:getDaily(), settings:getSettings()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='词书架-备份-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('备份已导出');
}
function validateBackup(data){
  if(!data || typeof data!=='object' || Array.isArray(data)) return {ok:false, msg:'文件不是有效的 JSON 对象'};
  if(data.app && data.app!=='词书架') return {ok:false, msg:'这不是词书架的备份文件（app 标识不符）'};
  if(data.ver!==undefined && (typeof data.ver!=='number' || data.ver<1)) return {ok:false, msg:'备份版本号无效'};
  if(!data.progress || typeof data.progress!=='object' || Array.isArray(data.progress)) return {ok:false, msg:'备份缺少 progress 学习数据'};
  let bad=null;
  for(const k in data.progress){
    const bp=data.progress[k];
    if(!bp || typeof bp!=='object' || !bp.words || typeof bp.words!=='object'){ bad=k; break; }
  }
  if(bad) return {ok:false, msg:'备份数据损坏（分册 '+bad+'）'};
  return {ok:true, ver:data.ver||0, hasDaily:!!data.daily, hasSettings:!!data.settings};
}
function restoreAllData(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json,application/json';
  input.onchange=()=>{
    const f=input.files&&input.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let data;
      try{ data=JSON.parse(rd.result); }
      catch(e){ toast('备份文件不是有效 JSON'); return; }
      const v=validateBackup(data);
      if(!v.ok){ toast('导入失败：'+v.msg); return; }
      const verTip = v.ver>0 ? ('备份版本 v'+v.ver) : '（旧版备份，可能缺少新字段）';
      confirmDialog('恢复备份','将用 '+verTip+' 覆盖当前所有学习记录、统计与设置。恢复前会自动保存当前数据快照，可随时撤销。','恢复','danger',()=>{
        store.set('v14lastRestore',{ts:Date.now(), progress:getProgress(), daily:getDaily(), settings:getSettings()});
        store.set('v14progress', data.progress||{});
        if(data.daily) store.set('v14daily', data.daily);
        if(data.settings) store.set('v14settings', data.settings);
        App.progress=null; App.daily=null; App.settings=null;
        applyTheme(); renderSettings(); toast('已恢复备份（可撤销）');
      });
    };
    rd.readAsText(f);
  };
  input.click();
}
function undoRestoreAll(){
  const snap=store.get('v14lastRestore',null);
  if(!snap){ toast('没有可撤销的恢复'); return; }
  confirmDialog('撤销上次恢复','将回退至 '+new Date(snap.ts).toLocaleString()+' 的数据状态。','撤销','danger',()=>{
    store.set('v14progress', snap.progress||{});
    store.set('v14daily', snap.daily||{});
    store.set('v14settings', snap.settings||{});
    localStorage.removeItem('v14lastRestore');
    App.progress=null; App.daily=null; App.settings=null;
    applyTheme(); renderSettings(); toast('已撤销恢复');
  });
}

let reminderDismissed=false;
function checkReminder(){
  const s=getSettings();
  if(!s.reminder) return;
  if(reminderDismissed) return;
  const due=allDueQueue().length;
  const banner=$('reminderBanner');
  if(due>0 && s.streakLast!==todayStr()){
    $('remTitle').textContent='有 '+due+' 张卡片待复习';
    $('remSub').textContent='距离上次学习已过一天，复习巩固效果最佳';
    banner.classList.add('show');
  }
  // desktop notification
  if(due>0 && 'Notification' in window && Notification.permission==='granted'){
    const last=new Date(s.lastReminderDate||0).toDateString();
    if(last!==new Date().toDateString()){
      try{ new Notification('词书架',{body:'有 '+due+' 张卡片待复习',tag:'vocab-reminder'}); }catch(e){}
      s.lastReminderDate=Date.now(); saveSettings();
    }
  }
}

/* ===================== Keyboard ===================== */
document.addEventListener('keydown',e=>{
  const inStudy=$('study').classList.contains('open');
  if(e.key==='Escape'){ if(inStudy) exitStudy(); else if($('mask').classList.contains('show')) $('mask').classList.remove('show'); return; }
  if(!inStudy) return;
  const isInput=e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA';
  if(e.key===' '&&!isInput&&App.study.mode==='unit'){ e.preventDefault(); flipCard(); return; }
  if(isInput) return;
  if(e.key>='1'&&e.key<='4') rate(Number(e.key));
  else if(e.key==='ArrowDown'||e.key==='j') nextWord();
  else if(e.key==='ArrowUp'||e.key==='k') prevWord();
});

/* ===================== Init ===================== */
(async function init(){
  migrateLegacyProgress();
  const s=getSettings();
  applyTheme();
  App.currentBookId=s.currentBookId||'2000CEW1';
  App.currentSeries=s.currentSeries||getBook(App.currentBookId).series;
  App.libSeries=s.libSeries||App.currentSeries;
  App.libView=s.libView||'grid';
  App.statDays=7;
  // 老用户迁移：已有学习进度但从未在书架上选过系列时，自动记忆当前系列，避免被迫重选
  if(!s.seriesChosen){
    let totalLearned=0;
    SERIES_ORDER.forEach(se=>{ totalLearned+=seriesStat(se).learned; });
    if(totalLearned>0){
      s.seriesChosen=true;
      s.currentSeries=getBook(App.currentBookId).series;
      s.libSeries=s.currentSeries;
      App.libSeries=s.currentSeries;
      saveSettings();
    }
  }
  const color=SERIES_COLOR[App.currentSeries];
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-tint', SERIES_TINT[App.currentSeries]);
  await loadBook(App.currentBookId);
  showScreen(s.seriesChosen?'library':'welcome');
  checkReminder();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
