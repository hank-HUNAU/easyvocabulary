<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="48" y1="28" x2="474" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42C8FF"/>
      <stop offset="0.48" stop-color="#1478F2"/>
      <stop offset="1" stop-color="#174BC7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(112 82) rotate(42) scale(252)">
      <stop stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="152" y1="96" x2="370" y2="402" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF6FF"/>
    </linearGradient>
    <filter id="shadow" x="72" y="48" width="368" height="408" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#003B9B" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="70" y="56" width="370" height="390" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00327F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <circle cx="462" cy="52" r="132" fill="#8BF3E8" opacity="0.12"/>
  <circle cx="30" cy="478" r="156" fill="#002F9F" opacity="0.12"/>

  <g opacity="0.24" filter="url(#softShadow)">
    <rect x="111" y="103" width="290" height="334" rx="54" fill="#FFFFFF" transform="rotate(-8 256 270)"/>
    <rect x="121" y="82" width="290" height="334" rx="54" fill="#CFF6FF" transform="rotate(7 266 249)"/>
  </g>

  <rect x="128" y="76" width="256" height="356" rx="50" fill="url(#card)" filter="url(#shadow)"/>
  <rect x="144" y="92" width="224" height="324" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3"/>

  <text x="256" y="270" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif"
        font-size="158" font-weight="800" fill="#0D5CCB">词</text>
  <path d="M184 300H328" stroke="#8CD7F8" stroke-width="6" stroke-linecap="round"/>
  <text x="256" y="348" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="32" font-weight="700" letter-spacing="5" fill="#2E86C9">VOCAB</text>

  <g fill="#FFFFFF">
    <circle cx="207" cy="390" r="6"/>
    <circle cx="256" cy="390" r="6"/>
    <circle cx="305" cy="390" r="6"/>
  </g>
  <rect x="94" y="418" width="324" height="12" rx="6" fill="#FFFFFF" opacity="0.34"/>
